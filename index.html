<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Solve My Cube</title>
<meta name="description" content="Learn to solve a Rubik's Cube from zero with an interactive 3D cube, using the beginner layer-by-layer (daisy) method.">
<meta name="theme-color" content="#FFF6EA">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FFF6EA;
  --bg-blob: #FFE6C7;
  --panel: #FFFFFF;
  --panel-2: #FFF1DE;
  --ink: #23203A;
  --ink-soft: #6B6680;
  --line: #F0E2CF;
  --line-strong: #E3CDB0;
  --accent: #6A4BF5;
  --accent-deep: #4A2FD0;
  --accent-soft: #ECE7FF;
  --pop: #FF3D8B;
  --good: #12A564;
  --good-soft: #DDF7EA;
  --warn: #F08A00;
  --stage-a: #FFFDF8;
  --stage-b: #FFE9CC;
  --shadow: 0 10px 30px -14px rgba(60, 40, 20, .35);
  --font-display: "Fredoka", ui-rounded, "Nunito", system-ui, sans-serif;
  --font-body: "Nunito", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --nav-h: 68px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15132A; --bg-blob: #221E44; --panel: #201D3A; --panel-2: #2A2649;
    --ink: #F3F0FF; --ink-soft: #A8A2C8; --line: #312C55; --line-strong: #403A6B;
    --accent: #8B73FF; --accent-deep: #5B41D6; --accent-soft: #2E2858; --pop: #FF5C9F;
    --good: #3DD68C; --good-soft: #193A2E; --warn: #FFB13B;
    --stage-a: #26224A; --stage-b: #15132A; --shadow: 0 10px 30px -14px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15132A; --bg-blob: #221E44; --panel: #201D3A; --panel-2: #2A2649;
  --ink: #F3F0FF; --ink-soft: #A8A2C8; --line: #312C55; --line-strong: #403A6B;
  --accent: #8B73FF; --accent-deep: #5B41D6; --accent-soft: #2E2858; --pop: #FF5C9F;
  --good: #3DD68C; --good-soft: #193A2E; --warn: #FFB13B;
  --stage-a: #26224A; --stage-b: #15132A; --shadow: 0 10px 30px -14px rgba(0, 0, 0, .6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 500 16px/1.5 var(--font-body);
  -webkit-font-smoothing: antialiased;
  display: grid;
  grid-template-rows: auto 1fr auto;
  height: 100dvh;
  overflow: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; line-height: 1.15; margin: 0; letter-spacing: -.01em; }
p { margin: 0 0 .7em; }
p:last-child { margin-bottom: 0; }
kbd, .mono { font-family: var(--font-mono); font-size: .9em; }

/* ---------- Top bar ---------- */
.topbar {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top));
}
.logo { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 20px; text-decoration: none; color: inherit; }
.logo-mark { width: 32px; height: 32px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 3px; border-radius: 9px; background: #17151F; transform: rotate(-8deg); }
.logo-mark i { border-radius: 2.5px; }
.top-tabs { display: none; margin-left: auto; gap: 6px; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 2px solid var(--line); background: var(--panel); display: grid; place-items: center; }
.icon-btn svg { width: 20px; height: 20px; }
.topbar .icon-btn { margin-left: auto; }

/* ---------- Bottom nav ---------- */
.bottomnav {
  display: grid; grid-template-columns: repeat(4, 1fr);
  background: var(--panel); border-top: 2px solid var(--line);
  padding: 6px 12px max(6px, env(safe-area-inset-bottom));
}
.tab {
  border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px;
  font: 600 13px var(--font-display); color: var(--ink-soft); padding: 6px; border-radius: 14px;
}
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }

main { position: relative; overflow: hidden; min-height: 0; }
.view { position: absolute; inset: 0; display: none; }
.view.active { display: flex; }
.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; }

/* ---------- Buttons ---------- */
.btn {
  --b: var(--accent); --bd: var(--accent-deep); --fg: #fff;
  border: 0; border-radius: 14px; padding: 12px 18px; min-height: 46px;
  background: var(--b); color: var(--fg);
  font: 600 16px var(--font-display); letter-spacing: .01em;
  box-shadow: 0 4px 0 var(--bd);
  transition: transform .08s, box-shadow .08s, filter .15s;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  -webkit-tap-highlight-color: transparent;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--bd); }
.btn:disabled { filter: grayscale(.8) opacity(.5); pointer-events: none; }
.btn.ghost { --b: var(--panel); --bd: var(--line-strong); --fg: var(--ink); border: 2px solid var(--line-strong); }
.btn.good { --b: var(--good); --bd: #0B7A49; }
.btn.pop { --b: var(--pop); --bd: #C51F63; }
.btn.small { min-height: 38px; padding: 7px 12px; font-size: 14px; border-radius: 12px; box-shadow: 0 3px 0 var(--bd); }
.btn.round { width: 50px; padding: 0; }
.btn svg { width: 20px; height: 20px; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn-row.spread { justify-content: space-between; }
.link { background: none; border: 0; color: var(--accent); font-weight: 700; padding: 0; text-decoration: underline; text-underline-offset: 3px; }

.seg { display: inline-flex; padding: 4px; gap: 4px; background: var(--panel-2); border-radius: 14px; border: 2px solid var(--line); }
.seg button { border: 0; background: none; border-radius: 10px; padding: 7px 14px; font: 600 14px var(--font-display); color: var(--ink-soft); }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--accent); box-shadow: 0 2px 0 var(--line-strong); }

/* ---------- Learn list ---------- */
#view-learn { flex-direction: column; }
.learn-wrap { max-width: 760px; width: 100%; margin: 0 auto; padding: 8px 16px 32px; }
.hero {
  position: relative; overflow: hidden;
  background: var(--accent); color: #fff; border-radius: 26px; padding: 22px 20px; margin-bottom: 18px;
  box-shadow: 0 6px 0 var(--accent-deep);
}
.hero h1 { font-size: 28px; font-weight: 700; max-width: 15ch; }
.hero p { opacity: .92; margin-top: 8px; max-width: 34ch; }
.hero .btn { margin-top: 14px; --b: #fff; --bd: rgba(0,0,0,.18); --fg: var(--accent-deep); }
.hero-cubes { position: absolute; right: -14px; top: 14px; display: grid; grid-template-columns: repeat(3, 26px); gap: 4px; transform: rotate(14deg); opacity: .95; }
.hero-cubes i { width: 26px; height: 26px; border-radius: 7px; }
.progress-line { display: flex; align-items: center; gap: 10px; font: 600 14px var(--font-display); margin-top: 14px; }
.bar { flex: 1; height: 10px; border-radius: 99px; background: rgba(255,255,255,.25); overflow: hidden; }
.bar > i { display: block; height: 100%; background: #FFD52E; border-radius: 99px; transition: width .4s; }
.section-title { font: 600 15px var(--font-display); color: var(--ink-soft); margin: 18px 4px 10px; text-transform: uppercase; letter-spacing: .06em; }
.lesson-list { display: grid; gap: 12px; }
.lesson-card {
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px;
  text-align: left; width: 100%; padding: 14px 16px; border-radius: 20px;
  background: var(--panel); border: 2px solid var(--line); box-shadow: 0 4px 0 var(--line);
  transition: transform .1s;
}
.lesson-card:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--line); }
.lesson-num {
  width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center;
  font: 700 20px var(--font-display); color: #fff; background: var(--c); box-shadow: inset 0 -4px 0 rgba(0,0,0,.18);
}
.lesson-num.light { color: #23203A; }
.lesson-card h3 { font-size: 18px; }
.lesson-card p { margin: 2px 0 0; color: var(--ink-soft); font-size: 14px; line-height: 1.35; }
.status { font: 600 13px var(--font-display); padding: 4px 10px; border-radius: 99px; background: var(--panel-2); color: var(--ink-soft); white-space: nowrap; }
.status.done { background: var(--good-soft); color: var(--good); }
.status.next { background: var(--accent-soft); color: var(--accent); }
.note { font-size: 14px; color: var(--ink-soft); background: var(--panel-2); border-radius: 16px; padding: 12px 14px; margin-top: 18px; }

/* ---------- Split views (cube + panel) ---------- */
.split { flex-direction: column; }
.stage {
  position: relative; flex: 1 1 46%; min-height: 230px;
  background: radial-gradient(ellipse at 50% 55%, var(--stage-a) 0%, var(--stage-b) 75%);
}
.cube-canvas { position: absolute; inset: 0; }
.cube-canvas canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
.stage-tools { position: absolute; top: 10px; right: 10px; display: flex; flex-direction: column; gap: 8px; z-index: 2; }
.stage-tools .icon-btn { background: color-mix(in srgb, var(--panel) 85%, transparent); backdrop-filter: blur(6px); }
.stage-label {
  position: absolute; left: 12px; top: 12px; z-index: 2;
  font: 600 13px var(--font-display); padding: 5px 11px; border-radius: 99px;
  background: color-mix(in srgb, var(--panel) 85%, transparent); border: 2px solid var(--line); backdrop-filter: blur(6px);
}
.stage-label:empty { display: none; }
.panel {
  flex: 1 1 54%; min-height: 0; background: var(--panel); border-radius: 26px 26px 0 0;
  margin-top: -22px; position: relative; z-index: 3; box-shadow: 0 -8px 24px -18px rgba(0,0,0,.35);
  display: flex; flex-direction: column;
}
.panel-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px 6px; }
.panel-head h2 { font-size: 20px; flex: 1; min-width: 0; }
.back { border: 0; background: var(--panel-2); border-radius: 12px; width: 38px; height: 38px; display: grid; place-items: center; flex: none; }
.back svg { width: 20px; height: 20px; }
.panel-body { flex: 1; min-height: 0; overflow-y: auto; padding: 6px 16px 16px; }
.panel-foot { padding: 10px 16px 14px; border-top: 2px solid var(--line); display: flex; gap: 10px; align-items: center; }
.panel-foot .btn { flex: 1; }
.dots { display: flex; gap: 6px; justify-content: center; padding: 0 16px 6px; }
.dots button { width: 8px; height: 8px; padding: 0; border: 0; border-radius: 99px; background: var(--line-strong); transition: width .2s; position: relative; }
.dots button::after { content: ""; position: absolute; inset: -10px -4px; }
.dots button.on { width: 22px; background: var(--accent); }
.dots button.seen { background: color-mix(in srgb, var(--accent) 45%, var(--line-strong)); }

.eyebrow { font: 600 13px var(--font-display); color: var(--accent); text-transform: uppercase; letter-spacing: .07em; margin-bottom: 4px; }
.page-title { font-size: 22px; margin-bottom: 10px; }
.tips { padding-left: 0; list-style: none; margin: 8px 0 0; display: grid; gap: 8px; }
.tips li { background: var(--panel-2); border-radius: 14px; padding: 10px 12px 10px 40px; position: relative; font-size: 15px; }
.tips li::before { content: attr(data-i); position: absolute; left: 10px; top: 10px; width: 22px; height: 22px; border-radius: 8px; background: var(--accent); color: #fff; font: 700 13px/22px var(--font-display); text-align: center; }

.alg-card { border: 2px solid var(--line); border-radius: 18px; padding: 12px; margin: 12px 0; background: var(--panel); }
.alg-card h4 { margin: 0 0 8px; font: 600 15px var(--font-display); display: flex; align-items: center; gap: 8px; }
.alg-card h4 .count { margin-left: auto; font-size: 13px; color: var(--pop); background: color-mix(in srgb, var(--pop) 12%, transparent); padding: 2px 9px; border-radius: 99px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  --c: var(--ink-soft);
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 10px 5px 7px; border-radius: 11px; background: var(--panel-2); border: 2px solid transparent;
  font: 600 14px var(--font-display); white-space: nowrap; transition: transform .15s, opacity .2s, border-color .2s;
}
.chip .dot { width: 14px; height: 14px; border-radius: 5px; background: var(--c); box-shadow: inset 0 0 0 1.5px rgba(0,0,0,.18); flex: none; }
.chip .nt { font-family: var(--font-mono); font-size: 13px; color: var(--accent); }
.chip.done { opacity: .45; }
.chip.now { border-color: var(--pop); background: color-mix(in srgb, var(--pop) 12%, var(--panel)); transform: scale(1.06); }
.chip.sep { background: none; padding: 5px 2px; color: var(--ink-soft); }

.step-card { background: var(--panel-2); border-radius: 20px; padding: 14px; margin-top: 10px; }
.step-meta { display: flex; align-items: center; gap: 8px; font: 600 13px var(--font-display); color: var(--ink-soft); margin-bottom: 6px; }
.step-meta .pill { background: var(--panel); border-radius: 99px; padding: 2px 10px; color: var(--accent); }
.step-card h3 { font-size: 19px; margin-bottom: 6px; }
.step-card .chips { margin-top: 10px; }
.controls { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; }
.panel-foot .controls .btn { flex: none; }
.controls .btn.play { width: 64px; height: 56px; }
.ex-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: space-between; }
.speed-btn { min-width: 52px; }

.try-hint { display: flex; gap: 10px; align-items: center; background: var(--accent-soft); color: var(--ink); border-radius: 14px; padding: 10px 12px; font-size: 14px; margin-top: 10px; }
.try-hint b { color: var(--accent); }
.big-next { display: flex; align-items: center; gap: 12px; width: 100%; margin-top: 0; padding: 12px; border-radius: 16px; border: 2px solid var(--pop); background: color-mix(in srgb, var(--pop) 8%, var(--panel)); box-shadow: 0 4px 0 color-mix(in srgb, var(--pop) 55%, transparent); text-align: left; font: inherit; color: inherit; transition: transform .08s, box-shadow .08s; }
.big-next:active { transform: translateY(3px); box-shadow: 0 1px 0 color-mix(in srgb, var(--pop) 55%, transparent); }
.coach-foot { gap: 8px; align-items: stretch; }
.coach-foot .big-next { flex: 1; min-width: 0; padding: 10px; }
.mini-col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; flex: none; }
.mini-col small { font: 600 11px var(--font-display); color: var(--ink-soft); }
.coach-foot .mini-col .btn.round { flex: none; width: 46px; height: 46px; min-height: 46px; }
#view-solve.editing .stage { flex: 0 0 30%; min-height: 170px; }
@media (min-width: 900px) { #view-solve.editing .stage { flex: 1 1 auto; } }
.big-next-text { margin-left: auto; text-align: right; font-size: 13px; color: var(--ink-soft); }
.big-next-text b { display: block; color: var(--pop); font: 600 15px var(--font-display); margin-top: 2px; }
.big-next .chip { font-size: 17px; padding: 8px 14px 8px 10px; }
.big-next .chip .dot { width: 18px; height: 18px; }
.big-next small { color: var(--ink-soft); display: block; font-size: 13px; }

.pad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
.pad button {
  --c: #999;
  border: 2px solid var(--line-strong); background: var(--panel); border-radius: 13px; min-height: 48px;
  font: 600 14px var(--font-display); display: flex; align-items: center; justify-content: center; gap: 6px; padding: 4px;
  box-shadow: 0 3px 0 var(--line-strong);
}
.pad button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line-strong); }
.pad button .dot { width: 14px; height: 14px; border-radius: 5px; background: var(--c); box-shadow: inset 0 0 0 1.5px rgba(0,0,0,.18); }
.pad button .nt { font-family: var(--font-mono); font-size: 12px; color: var(--accent); }
.pad .wide { grid-column: span 2; }
details.pad-wrap { margin-top: 12px; }
details.pad-wrap summary { font: 600 14px var(--font-display); color: var(--accent); cursor: pointer; list-style: none; }
details.pad-wrap summary::-webkit-details-marker { display: none; }

.done-card { text-align: center; padding: 18px 8px 6px; }
.done-card .big { font-size: 52px; line-height: 1; }
.done-card h3 { font-size: 24px; margin: 10px 0 6px; }

/* ---------- Play ---------- */
.diff { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 6px; }
.diff button {
  border: 2px solid var(--line-strong); background: var(--panel); border-radius: 13px; padding: 7px 2px 6px;
  font: 600 14px var(--font-display); display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.diff button small { font: 600 11px var(--font-body); color: var(--ink-soft); }
.diff button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.diff-bars { display: flex; gap: 2px; align-items: flex-end; height: 12px; }
.diff-bars i { width: 4px; border-radius: 2px; background: var(--line-strong); }
.diff-bars i.on { background: currentColor; }
.timer-chip {
  position: absolute; left: 50%; bottom: 34px; transform: translateX(-50%); z-index: 2;
  font: 600 22px var(--font-mono); padding: 6px 16px; border-radius: 16px;
  background: color-mix(in srgb, var(--panel) 88%, transparent); border: 2px solid var(--line); backdrop-filter: blur(6px);
  display: none; white-space: nowrap;
}
.timer-chip small { font: 600 13px var(--font-display); color: var(--ink-soft); margin-left: 8px; }
.timer-chip.show { display: block; }
.timer-chip.armed { color: var(--ink-soft); font-size: 15px; font-family: var(--font-display); }
.scramble-box { background: var(--panel-2); border-radius: 16px; padding: 12px; margin-top: 12px; }
.scramble-box .lbl { font: 600 13px var(--font-display); color: var(--ink-soft); margin-bottom: 8px; display: flex; justify-content: space-between; gap: 8px; }
.row-title { font: 600 15px var(--font-display); margin: 16px 0 4px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }

/* ---------- Timer ---------- */
#view-timer { flex-direction: column; }
.timer-wrap { max-width: 640px; width: 100%; margin: 0 auto; padding: 8px 16px 32px; }
.timer-pad {
  width: 100%; border: 0; border-radius: 28px; padding: 28px 16px; margin-top: 12px;
  background: var(--panel); box-shadow: 0 6px 0 var(--line-strong); border: 2px solid var(--line-strong);
  display: flex; flex-direction: column; align-items: center; gap: 6px; -webkit-tap-highlight-color: transparent;
  user-select: none; -webkit-user-select: none; touch-action: manipulation;
}
.timer-pad .time { font: 600 clamp(48px, 16vw, 84px)/1 var(--font-mono); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.timer-pad .hint { font: 600 14px var(--font-display); color: var(--ink-soft); }
.timer-pad.running { background: var(--accent); color: #fff; box-shadow: 0 6px 0 var(--accent-deep); border-color: var(--accent-deep); }
.timer-pad.running .hint { color: rgba(255,255,255,.8); }
.timer-pad.ready { background: var(--good-soft); border-color: var(--good); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
.stat { background: var(--panel); border: 2px solid var(--line); border-radius: 16px; padding: 10px; text-align: center; }
.stat b { display: block; font: 600 20px var(--font-mono); font-variant-numeric: tabular-nums; }
.stat span { font: 600 12px var(--font-display); color: var(--ink-soft); text-transform: uppercase; letter-spacing: .05em; }
.times { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 6px; }
.times li { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 8px 8px 8px 14px; }
.times .t { font: 600 16px var(--font-mono); font-variant-numeric: tabular-nums; }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// ==CORE START==
// ---------- Cube model ----------
// Coordinates: x → right, y → up, z → toward you. Faces in URFDLB order.
// The cube is held yellow up, green front for the whole method.
const FACES = ['U', 'R', 'F', 'D', 'L', 'B'];
const NORMALS = { U: [0, 1, 0], R: [1, 0, 0], F: [0, 0, 1], D: [0, -1, 0], L: [-1, 0, 0], B: [0, 0, -1] };
const HOME_COLORS = { U: 'Y', R: 'O', F: 'G', D: 'W', L: 'R', B: 'B' };
const COLOR_NAMES = { Y: 'yellow', O: 'orange', G: 'green', W: 'white', R: 'red', B: 'blue' };

function stickerRowCol(face, [x, y, z]) {
  switch (face) {
    case 'U': return [z + 1, x + 1];
    case 'D': return [1 - z, x + 1];
    case 'F': return [1 - y, x + 1];
    case 'B': return [1 - y, 1 - x];
    case 'R': return [1 - y, 1 - z];
    case 'L': return [1 - y, z + 1];
  }
}

// STICKERS[i] = { face, pos, n } with i = face*9 + row*3 + col
const STICKERS = [];
const STICKER_KEY = new Map();
const keyOf = (p, n) => p.join(',') + '|' + n.join(',');
for (let x = -1; x <= 1; x++) for (let y = -1; y <= 1; y++) for (let z = -1; z <= 1; z++) {
  const pos = [x, y, z];
  FACES.forEach((face, fi) => {
    const n = NORMALS[face];
    const a = n.findIndex(v => v !== 0);
    if (pos[a] !== n[a]) return;
    const [r, c] = stickerRowCol(face, pos);
    const i = fi * 9 + r * 3 + c;
    STICKERS[i] = { face, pos, n };
    STICKER_KEY.set(keyOf(pos, n), i);
  });
}

// Pieces: cubie positions with their sticker indices
const PIECES = [];
for (let x = -1; x <= 1; x++) for (let y = -1; y <= 1; y++) for (let z = -1; z <= 1; z++) {
  const pos = [x, y, z];
  const nz = pos.filter(v => v !== 0).length;
  if (nz < 1) continue;
  const stickers = [];
  STICKERS.forEach((s, i) => { if (s.pos[0] === x && s.pos[1] === y && s.pos[2] === z) stickers.push(i); });
  PIECES.push({ pos, stickers, type: nz === 1 ? 'center' : nz === 2 ? 'edge' : 'corner' });
}
const pieceAt = (x, y, z) => PIECES.find(p => p.pos[0] === x && p.pos[1] === y && p.pos[2] === z);

function rotVec([x, y, z], axis, quarter) {
  // rotate by quarter*90° about +axis (right-hand rule)
  let q = ((quarter % 4) + 4) % 4;
  let v = [x, y, z];
  for (let k = 0; k < q; k++) {
    const [a, b, c] = v;
    if (axis === 0) v = [a, -c, b];
    else if (axis === 1) v = [c, b, -a];
    else v = [-b, a, c];
  }
  return v;
}

// Base moves: axis, layers, quarter turns about +axis
const BASE_MOVES = {
  R: [0, [1], -1], L: [0, [-1], 1], M: [0, [0], 1], x: [0, [-1, 0, 1], -1],
  U: [1, [1], -1], D: [1, [-1], 1], E: [1, [0], 1], y: [1, [-1, 0, 1], -1],
  F: [2, [1], -1], B: [2, [-1], 1], S: [2, [0], -1], z: [2, [-1, 0, 1], -1],
};

function parseMove(tok) {
  const m = /^([URFDLBMESxyz])(2|'|2')?$/.exec(tok);
  if (!m) throw new Error('Bad move ' + tok);
  const amount = m[2] === "'" ? -1 : m[2] ? 2 : 1;
  return { base: m[1], amount };
}

const PERMS = {};
function permFor(tok) {
  if (PERMS[tok]) return PERMS[tok];
  const { base, amount } = parseMove(tok);
  const [axis, layers, q] = BASE_MOVES[base];
  const quarter = q * amount;
  const perm = new Array(54);
  for (let i = 0; i < 54; i++) perm[i] = i;
  STICKERS.forEach((s, i) => {
    if (!layers.includes(s.pos[axis])) return;
    const j = STICKER_KEY.get(keyOf(rotVec(s.pos, axis, quarter), rotVec(s.n, axis, quarter)));
    perm[j] = i; // new[j] = old[i]
  });
  return (PERMS[tok] = perm);
}

const solvedState = () => FACES.flatMap(f => Array(9).fill(HOME_COLORS[f]));
const splitAlg = alg => (Array.isArray(alg) ? alg : alg.trim().split(/\s+/).filter(Boolean));
function applyMove(state, tok) {
  const p = permFor(tok);
  const out = new Array(54);
  for (let i = 0; i < 54; i++) out[i] = state[p[i]];
  return out;
}
const applyAlg = (state, alg) => splitAlg(alg).reduce(applyMove, state);
function invertMove(tok) {
  const { base, amount } = parseMove(tok);
  return amount === 2 ? base + '2' : amount === 1 ? base + "'" : base;
}
const invertAlg = alg => splitAlg(alg).slice().reverse().map(invertMove);
const center = (state, face) => state[FACES.indexOf(face) * 9 + 4];
const isSolved = state => FACES.every((f, fi) => state.slice(fi * 9, fi * 9 + 9).every(c => c === state[fi * 9 + 4]));

function moveTurn(tok) {
  // Describes a move for animation: axis index, layers and total angle in quarter turns
  const { base, amount } = parseMove(tok);
  const [axis, layers, q] = BASE_MOVES[base];
  return { axis, layers, quarter: q * amount };
}
function moveFromTurn(axis, layer, quarter) {
  // Inverse of moveTurn for single-layer quarter turns (used by swipes)
  for (const [base, [a, layers, q]] of Object.entries(BASE_MOVES)) {
    if (a !== axis || layers.length !== 1 || layers[0] !== layer) continue;
    return quarter === q ? base : base + "'";
  }
  return null;
}

// Merge consecutive same-face moves (R R → R2, R R' → nothing)
function simplify(moves) {
  const out = [];
  for (const tok of moves) {
    const last = out[out.length - 1];
    if (last && parseMove(last).base === parseMove(tok).base) {
      const b = parseMove(tok).base;
      const total = (((parseMove(last).amount + parseMove(tok).amount) % 4) + 4) % 4;
      out.pop();
      if (total === 1) out.push(b);
      else if (total === 2) out.push(b + '2');
      else if (total === 3) out.push(b + "'");
    } else out.push(tok);
  }
  return out;
}

// ---------- Scrambles ----------
const DIFFICULTIES = [
  { id: 'tiny', label: 'Tiny', moves: 3, blurb: 'Undo it in a few turns' },
  { id: 'easy', label: 'Easy', moves: 6, blurb: 'A gentle mix' },
  { id: 'medium', label: 'Medium', moves: 10, blurb: 'Getting tricky' },
  { id: 'hard', label: 'Hard', moves: 15, blurb: 'Mostly mixed' },
  { id: 'full', label: 'Full', moves: 25, blurb: 'Fully scrambled' },
];
const AXIS_OF = { U: 1, D: 1, R: 0, L: 0, F: 2, B: 2 };
function makeScramble(length, rand = Math.random) {
  const faces = ['U', 'D', 'R', 'L', 'F', 'B'];
  const out = [];
  while (out.length < length) {
    const f = faces[Math.floor(rand() * 6)];
    const prev = out[out.length - 1]?.[0];
    const prev2 = out[out.length - 2]?.[0];
    if (f === prev) continue;
    // avoid things like R L R, which cancel into fewer moves
    if (prev && prev2 && AXIS_OF[f] === AXIS_OF[prev] && f === prev2) continue;
    out.push(f + ['', "'", '2'][Math.floor(rand() * 3)]);
  }
  return out;
}

// ---------- Beginner layer-by-layer solver ----------
// Produces steps a beginner would actually follow, stage by stage.

// ---------- Plain-language moves ----------
const MOVE_TEXT = {
  U: ['Top', '←', 'Turn the top layer to the left'],
  "U'": ['Top', '→', 'Turn the top layer to the right'],
  D: ['Bottom', '→', 'Turn the bottom layer to the right'],
  "D'": ['Bottom', '←', 'Turn the bottom layer to the left'],
  R: ['Right', '↑', 'Turn the right side up, away from you'],
  "R'": ['Right', '↓', 'Turn the right side down, toward you'],
  L: ['Left', '↓', 'Turn the left side down, toward you'],
  "L'": ['Left', '↑', 'Turn the left side up, away from you'],
  F: ['Front', '↻', 'Turn the front face clockwise'],
  "F'": ['Front', '↺', 'Turn the front face anticlockwise'],
  B: ['Back', '↺', 'Turn the back so its top goes to the left'],
  "B'": ['Back', '↻', 'Turn the back so its top goes to the right'],
  M: ['Middle', '↓', 'Turn the middle slice down'],
  "M'": ['Middle', '↑', 'Turn the middle slice up'],
  E: ['Equator', '→', 'Turn the middle row to the right'],
  "E'": ['Equator', '←', 'Turn the middle row to the left'],
  S: ['Slice', '↻', 'Turn the slice behind the front clockwise'],
  "S'": ['Slice', '↺', 'Turn the slice behind the front anticlockwise'],
  y: ['Whole cube', '←', 'Turn the whole cube so the front goes to the left'],
  "y'": ['Whole cube', '→', 'Turn the whole cube so the front goes to the right'],
  x: ['Whole cube', '↑', 'Tip the whole cube so the front goes up'],
  "x'": ['Whole cube', '↓', 'Tip the whole cube so the front goes down'],
  z: ['Whole cube', '↻', 'Roll the whole cube clockwise'],
  "z'": ['Whole cube', '↺', 'Roll the whole cube anticlockwise'],
};
const FACE_OF_BASE = { U: 'U', D: 'D', R: 'R', L: 'L', F: 'F', B: 'B' };
function moveLabel(tok, state) {
  const { base, amount } = parseMove(tok);
  const key = amount === 2 ? base : tok;
  const [name, arrow, long] = MOVE_TEXT[key];
  const face = FACE_OF_BASE[base];
  const color = face && state ? center(state, face) : null;
  const short = amount === 2 ? `${name} ×2` : `${name} ${arrow}`;
  let text = amount === 2 ? long + ', twice (half a turn)' : long;
  if (color) text = text.replace(/the (top layer|bottom layer|right side|left side|front face|back)/, (m, p) => `the ${p} (${COLOR_NAMES[color]})`);
  return { short, text, color };
}
function chipsHTML(moves, startState, { done = -1, now = -1 } = {}) {
  const notation = store.get('notation');
  let s = startState;
  return moves.map((tok, k) => {
    const lab = moveLabel(tok, s);
    s = applyMove(s, tok);
    const cls = k < done ? 'done' : k === now ? 'now' : '';
    const dot = lab.color ? `<i class="dot" style="background:${COLOR_HEX[lab.color]}"></i>` : '<i class="dot" style="background:var(--accent)"></i>';
    return `<span class="chip ${cls}" title="${lab.text}">${dot}${notation ? `<b class="nt">${pretty(tok)}</b>` : ''}<span>${lab.short}</span></span>`;
  }).join('');
}

// ---------- 3D cube ----------
const ARROW_COLOR = 0xff3d8b;
class Cube3D {
  constructor() {
    this.wrap = document.createElement('div');
    this.wrap.className = 'cube-canvas';
    this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    this.renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    this.wrap.appendChild(this.renderer.domElement);
    this.renderer.domElement.setAttribute('aria-label', '3D cube. Swipe a sticker to turn that layer, drag the background to look around.');
    this.renderer.domElement.setAttribute('role', 'img');

    this.scene = new THREE.Scene();
    this.camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
    this.scene.add(new THREE.HemisphereLight(0xffffff, 0x8a7f99, 1.6));
    const key = new THREE.DirectionalLight(0xffffff, 1.5);
    key.position.set(4, 9, 7);
    this.scene.add(key);
    const fill = new THREE.DirectionalLight(0xffffff, 0.5);
    fill.position.set(-6, -3, -4);
    this.scene.add(fill);
    this.root = new THREE.Group();
    this.scene.add(this.root);

    const bodyGeo = new RoundedBoxGeometry(0.97, 0.97, 0.97, 3, 0.11);
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x1b1925, roughness: 0.6 });
    const stickerGeo = roundedSquare(0.8, 0.14);
    this.cubies = [];
    this.stickerMeshes = [];
    const zAxis = new THREE.Vector3(0, 0, 1);
    PIECES.forEach(piece => {
      const g = new THREE.Group();
      g.userData.pos = piece.pos;
      g.position.set(...piece.pos);
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.userData.cubie = g;
      g.add(body);
      piece.stickers.forEach(i => {
        const s = STICKERS[i];
        const m = new THREE.Mesh(stickerGeo, new THREE.MeshStandardMaterial({ roughness: 0.32 }));
        const n = new THREE.Vector3(...s.n);
        m.position.copy(n).multiplyScalar(0.488);
        m.quaternion.setFromUnitVectors(zAxis, n);
        m.userData = { cubie: g, n: s.n };
        this.stickerMeshes[i] = m;
        g.add(m);
      });
      this.root.add(g);
      this.cubies.push(g);
    });

    this.state = solvedState();
    this.focus = null;
    this.gen = 0;
    this.anim = null;
    this.arrow = null;
    this.speed = 1;
    this.view = 'top';
    this.camAnim = null;
    this.inputEnabled = false;
    this.onUserMove = null;
    this.raycaster = new THREE.Raycaster();

    // Our pointer handler is added before OrbitControls so it can claim sticker drags first
    const el = this.renderer.domElement;
    el.addEventListener('pointerdown', e => this.pointerDown(e));
    el.addEventListener('pointermove', e => this.pointerMove(e));
    const end = () => { this.drag = null; this.controls.enabled = true; };
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
    this.controls = new OrbitControls(this.camera, el);
    this.controls.enablePan = false;
    this.controls.enableDamping = true;
    this.controls.dampingFactor = 0.12;
    this.controls.rotateSpeed = 0.8;
    this.controls.minDistance = 7;
    this.controls.maxDistance = 30;

    new ResizeObserver(() => this.resize()).observe(this.wrap);
    this.recolor();
    this.renderer.setAnimationLoop(t => this.frame(t));
  }

  mount(container) {
    if (this.wrap.parentNode !== container) container.prepend(this.wrap);
    this.resize();
  }
  resize() {
    const w = this.wrap.clientWidth, h = this.wrap.clientHeight;
    if (!w || !h) return;
    this.renderer.setSize(w, h, false);
    this.camera.aspect = w / h;
    this.camera.updateProjectionMatrix();
    this.fitDist = 11 / Math.min(1, Math.pow(this.camera.aspect, 0.9));
    if (!this.placed) { this.setView(this.view, true); this.placed = true; }
    else this.controls.maxDistance = Math.max(30, this.fitDist * 1.6);
  }
  viewDir(name) {
    const dirs = {
      top: [0.55, 0.5, 0.8], bottom: [0.55, -0.55, 0.78],
      // looking straight at one side, the way it's held while scanning
      F: [0.2, 0.28, 1], R: [1, 0.28, 0.2], B: [-0.2, 0.28, -1], L: [-1, 0.28, -0.2], U: [0, 1, 0.42], D: [0, -1, 0.42],
    };
    return new THREE.Vector3(...(dirs[name] || dirs.top)).normalize();
  }
  setView(name = this.view, instant = false) {
    this.view = name;
    const to = this.viewDir(name).multiplyScalar(this.fitDist || 10);
    if (instant) { this.camera.position.copy(to); this.camera.lookAt(0, 0, 0); this.camAnim = null; return; }
    this.camAnim = { from: this.camera.position.clone(), to, t0: performance.now(), dur: 550 };
  }

  setState(state) {
    this.stop();
    this.state = state.slice();
    this.normalize();
  }
  setFocus(colorSets) { this.focus = colorSets && colorSets.length ? colorSets : null; this.recolor(); }
  normalize() {
    for (const g of this.cubies) { g.position.set(...g.userData.pos); g.quaternion.identity(); }
    this.recolor();
  }
  recolor() {
    let keep = null;
    if (this.focus) {
      keep = new Set();
      for (const cs of this.focus) {
        const p = cs.length === 1
          ? PIECES.find(q => q.type === 'center' && this.state[q.stickers[0]] === cs[0])
          : findPiece(this.state, cs);
        if (p) p.stickers.forEach(i => keep.add(i));
      }
    }
    const dim = new THREE.Color(document.documentElement.dataset.dark === '1' ? 0x34304f : 0x4a4658);
    this.stickerMeshes.forEach((m, i) => {
      m.material.color.set(COLOR_HEX[this.state[i]]);
      if (keep && !keep.has(i)) m.material.color.lerp(dim, 0.8);
    });
  }

  get busy() { return !!this.anim; }
  stop() {
    this.gen++;
    if (this.anim) this.finishTurn();
    this.showArrow(null);
  }
  wait(ms) {
    const gen = this.gen;
    return new Promise(res => setTimeout(() => res(gen === this.gen), ms));
  }
  // Plays moves one by one. Resolves true when finished, false if interrupted by stop()/setState().
  async play(moves, { arrows = true, speed = 1, onProgress } = {}) {
    moves = splitAlg(moves);
    const gen = this.gen;
    const sp = this.speed * speed * (REDUCED ? 2 : 1);
    onProgress?.(0);
    for (let k = 0; k < moves.length; k++) {
      if (gen !== this.gen) return false;
      if (arrows) {
        this.showArrow(moves[k]);
        if (!(await this.wait(420 / sp))) return false;
      }
      this.showArrow(null);
      await this.turn(moves[k], sp);
      onProgress?.(k + 1);
      if (gen !== this.gen) return false;
    }
    return true;
  }
  turn(tok, sp = 1) {
    if (this.anim) this.finishTurn();
    const { axis, layers, quarter } = moveTurn(tok);
    const pivot = new THREE.Group();
    this.root.add(pivot);
    for (const g of this.cubies) if (layers.includes(g.userData.pos[axis])) pivot.attach(g);
    const dur = (Math.abs(quarter) === 2 ? 420 : 300) / sp;
    return new Promise(resolve => {
      this.anim = { tok, pivot, axis: 'xyz'[axis], target: quarter * Math.PI / 2, t0: performance.now(), dur, resolve };
    });
  }
  finishTurn() {
    const a = this.anim;
    this.anim = null;
    for (const g of [...a.pivot.children]) this.root.attach(g);
    this.root.remove(a.pivot);
    this.state = applyMove(this.state, a.tok);
    this.normalize();
    a.resolve();
  }

  showArrow(tok) {
    if (this.arrow) {
      this.root.remove(this.arrow);
      this.arrow.traverse(o => { o.geometry?.dispose(); o.material?.map?.dispose(); o.material?.dispose(); });
      this.arrow = null;
    }
    if (!tok) return;
    const { axis, layers, quarter } = moveTurn(tok);
    const A = new THREE.Vector3().setComponent(axis, 1);
    const e1 = new THREE.Vector3().setComponent((axis + 1) % 3, 1);
    const e2 = new THREE.Vector3().setComponent((axis + 2) % 3, 1);
    const whole = layers.length === 3;
    const offset = whole ? 0 : layers[0];
    const R = whole ? 2.5 : 2.22;
    const cam = this.camera.position;
    const mid = Math.atan2(cam.dot(e2), cam.dot(e1));
    const dbl = Math.abs(quarter) === 2;
    const span = (dbl ? 170 : 96) * Math.PI / 180;
    const dir = Math.sign(quarter);
    const a0 = mid - dir * span / 2;
    const P = a => A.clone().multiplyScalar(offset).addScaledVector(e1, Math.cos(a) * R).addScaledVector(e2, Math.sin(a) * R);
    const pts = [];
    const headGap = 0.16;
    for (let k = 0; k <= 40; k++) pts.push(P(a0 + dir * (span - headGap) * k / 40));
    const mat = new THREE.MeshBasicMaterial({ color: ARROW_COLOR, transparent: true, opacity: 0.95 });
    const group = new THREE.Group();
    group.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 48, whole ? 0.075 : 0.065, 10), mat));
    const aEnd = a0 + dir * span;
    const tip = P(aEnd);
    const tangent = e1.clone().multiplyScalar(-Math.sin(aEnd)).addScaledVector(e2, Math.cos(aEnd)).multiplyScalar(dir).normalize();
    const cone = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.46, 18), mat);
    cone.position.copy(tip).addScaledVector(tangent, -0.12);
    cone.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), tangent);
    group.add(cone);
    if (dbl) {
      const c = document.createElement('canvas');
      c.width = c.height = 128;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#ff3d8b';
      ctx.beginPath(); ctx.arc(64, 64, 58, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = '700 64px Fredoka, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('×2', 64, 68);
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest: false }));
      const out = P(mid);
      sprite.position.copy(out).addScaledVector(out.clone().sub(A.clone().multiplyScalar(offset)).normalize(), 0.45);
      sprite.scale.setScalar(0.62);
      group.add(sprite);
    }
    group.userData.mat = mat;
    this.arrow = group;
    this.root.add(group);
  }

  // ----- swipe to turn -----
  ndc(e) {
    const r = this.renderer.domElement.getBoundingClientRect();
    return new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  }
  toScreen(v) {
    const r = this.renderer.domElement.getBoundingClientRect();
    const p = v.clone().project(this.camera);
    return new THREE.Vector2((p.x + 1) / 2 * r.width, (1 - p.y) / 2 * r.height);
  }
  pointerDown(e) {
    if (!this.inputEnabled) return;
    this.raycaster.setFromCamera(this.ndc(e), this.camera);
    const hit = this.raycaster.intersectObjects(this.cubies, true).find(h => h.object.userData.cubie);
    if (!hit) return;
    const g = hit.object.userData.cubie;
    let n = hit.object.userData.n;
    if (!n) {
      const wn = hit.face.normal.clone().transformDirection(hit.object.matrixWorld);
      const ax = [0, 1, 2].reduce((b, a) => Math.abs(wn.getComponent(a)) > Math.abs(wn.getComponent(b)) ? a : b, 0);
      n = [0, 0, 0]; n[ax] = Math.sign(wn.getComponent(ax));
    }
    const ax = n.findIndex(v => v !== 0);
    if (g.userData.pos[ax] !== n[ax]) return;

    g.normalize();

    let best = null, bestDot = -2;
    for (let a = 0; a < 3; a++) {
      if (a === ax) continue;
      for (const s of [1, -1]) {
        const dir = [0, 0, 0]; dir[a] = s;
        const sv = this.toScreen(d.point.clone().add(new THREE.Vector3(...dir).multiplyScalar(0.6))).sub(base).normalize();

    // whether it also fits a move they expect: the touched cubie is in that layer and the
    // sticker would move roughly the way the finger moved.
    const point = d.point.clone(), pos = d.pos, drag = g.clone();

      const t = moveTurn(want);

      const c = this.camAnim;
      const p = Math.min(1, (t - c.t0) / c.dur);

      this.camera.position.lerpVectors(c.from, c.to, e);

    }
    if (this.arrow) this.arrow.userData.mat.opacity = 0.7 + 0.3 * Math.sin(t / 140);
    if (!this.camAnim) this.controls.update();
    else this.camera.lookAt(0, 0, 0);
    if (this.wrap.isConnected && this.wrap.clientWidth) this.renderer.render(this.scene, this.camera);
  }
}
function roundedSquare(size, r) {
  const s = size / 2;
  const sh = new THREE.Shape();
  sh.moveTo(-s + r, -s);
  sh.lineTo(s - r, -s); sh.quadraticCurveTo(s, -s, s, -s + r);
  sh.lineTo(s, s - r); sh.quadraticCurveTo(s, s, s - r, s);
  sh.lineTo(-s + r, s); sh.quadraticCurveTo(-s, s, -s, s - r);
  sh.lineTo(-s, -s + r); sh.quadraticCurveTo(-s, -s, -s + r, -s);
  return new THREE.ShapeGeometry(sh, 6);
}

// ---------- Lesson content ----------
const ALG_INFO = {
  sexy: { name: 'The 4-move trick', alg: ALGS.sexy },
  right: { name: 'The Right move', alg: ALGS.right },
  left: { name: 'The Left move', alg: ALGS.left },
  fruruf: { name: 'The F-move', alg: ALGS.fruruf },
  sune: { name: 'The Fish move', alg: ALGS.sune },
  headlights: { name: 'The Headlights move', alg: ALGS.headlights },
  edges: { name: 'The Edge move', alg: ALGS.edges },
};
const cn = c => COLOR_NAMES[c];

function describeStep(step, stageId) {
  const k = step.kind;
  const alg = step.alg ? ALG_INFO[step.alg].name : '';
  switch (k) {
    case 'hold': return ['Hold it the right way', 'Turn the whole cube so yellow is on top and green faces you.'];
    case 'petal': return [`Petal ${step.count} of 4`, 'Find the highlighted white edge and bring it up next to the yellow center, white sticker facing up. If a petal is already in the spot it needs, the top turns first to move that petal out of the way.'];
    case 'align': return [`Line up the ${cn(step.color)} petal`, `Turn the top until the ${cn(step.color)} side of this petal sits right above the ${cn(step.color)} center.`];
    case 'drop': return [`Send the ${cn(step.color)} petal down`, `The ${cn(step.color)} sticker matches the ${cn(step.color)} center. Turn that side twice (half a turn) so the white sticker lands on the bottom.`];
    case 'cornerAbove': return ['Put the corner above its spot', `Find a white corner in the top layer. Turn the top until it sits right above its home: between the ${cn(step.colors[0])} and ${cn(step.colors[1])} centers.`];
    case 'holdFR': return stageId === 'middle'
      ? ['Hold the bad edge at front-right', 'Turn the whole cube so the highlighted edge is at the front-right.']
      : ['Hold it at front-right', 'Turn the whole cube so the highlighted corner is at the front-right, closest to your right hand.'];
    case 'sexyRepeat': return [`Do the 4-move trick ${step.reps}×`, `Repeat Right ↑, Top ←, Right ↓, Top → until the corner drops in with white on the bottom. This one needs ${step.reps} ${step.reps === 1 ? 'go' : 'goes'}. If you lose count, just keep going until it's right.`];
    case 'popCorner': return ['Free a stuck corner', 'This white corner is in the bottom layer but in the wrong place or twisted. With it at front-right, do the 4-move trick once to lift it into the top layer.'];
    case 'edgeAlign': return ['Make an upside-down T', `Find an edge in the top layer with no yellow on it. Turn the top until its side colour (${cn(step.color)}) sits above the ${cn(step.color)} center.`];
    case 'holdFront': return ['Face it toward you', `Turn the whole cube so the ${cn(step.color)} center is facing you.`];
    case 'insert': return [step.alg === 'right' ? 'It goes right: the Right move' : 'It goes left: the Left move',
      `The top sticker of the edge is ${cn(step.color)}, and the ${cn(step.color)} center is on the ${step.alg === 'right' ? 'right' : 'left'}. So the edge goes down to the ${step.alg === 'right' ? 'right' : 'left'}.`];
    case 'popEdge': return ['Free a stuck edge', 'There are no usable edges in the top, but a middle edge is wrong. Do the Right move once to swap it out into the top layer.'];
    case 'dot': return ['Yellow dot: do the F-move', 'Only the yellow center? Do the F-move once to make an L shape.'];
    case 'lTurn': return ['Point the L to the back-left', 'Turn the top until the yellow L is at the back-left, like the hands of a clock at 9:00.'];
    case 'lshape': return ['L shape: do the F-move', 'With the L at the back-left, do the F-move.'];
    case 'lineTurn': return ['Make the line go across', 'Turn the top so the yellow line goes left to right.'];
    case 'line': return ['Line: do the F-move', 'With the line going across, do the F-move to finish the yellow cross.'];
    case 'fishTurn': return ['You have a fish!', 'One yellow corner on top makes a fish shape. Turn the top so the fish’s head (the yellow corner) is at the front-left.'];
    case 'fish': return ['Do the Fish move', 'With the fish’s head at the front-left, do the Fish move.'];
    case 'noneTurn': return ['No yellow corners up', 'Turn the top until the front-left corner has its yellow sticker on the left side.'];
    case 'none': return ['Do the Fish move', 'Now do the Fish move. Keep going until the whole top is yellow.'];
    case 'twoTurn': return [`${step.count} yellow corners up`, 'Turn the top until the front-left corner has its yellow sticker facing you.'];
    case 'two': return ['Do the Fish move', 'Now do the Fish move. Keep going until the whole top is yellow.'];
    case 'headlightsBack': return ['Find the headlights', 'Headlights are two corners on one side with the same colour. Turn the top so the headlights are at the back.'];
    case 'headlights': return ['Do the Headlights move', 'With the headlights at the back, do the Headlights move. Now every side should have headlights.'];
    case 'noHeadlights': return ['No headlights yet', 'No side has headlights. Do the Headlights move once from anywhere and some will appear.'];
    case 'alignCorners': return ['Match the corners', 'Every side has headlights. Turn the top until they match the centers below.'];
    case 'edgeBack': return ['Solved side to the back', 'One side is fully finished. Turn the whole cube so that side is at the back.'];
    case 'edgeCycle': return ['Do the Edge move', 'Do the Edge move. If the edges went round the wrong way, just do it again.'];
    case 'noEdge': return ['No finished side yet', 'No side is fully finished. Do the Edge move once from anywhere; one side will be finished afterwards.'];
    case 'try': return [step.title, step.text];
    default: return [alg || 'Next', ''];
  }
}

// ---------- The example cube used across lessons ----------
let example = null;
function pickExampleScramble() {
  let best = null;
  for (let i = 0; i < 24; i++) {
    const sc = makeScramble(25);
    const stages = solveLBL(applyAlg(S0, sc));
    if (stages.length < 7 || stages.some(s => !s.steps.length)) continue;
    const n = stages.reduce((a, s) => a + s.steps.reduce((b, x) => b + x.moves.length, 0), 0);
    if (!best || n < best.n) best = { sc, n };
  }
  return (best || { sc: makeScramble(25) }).sc.join(' ');
}
function getExample() {
  if (!example) {
    let sc = store.get('example');
    if (!sc) { sc = pickExampleScramble(); store.set('example', sc); }
    const start = applyAlg(S0, sc);
    example = { scramble: splitAlg(sc), start, stages: solveLBL(start) };
  }
  return example;
}
function newExample() {
  store.set('example', pickExampleScramble());
  example = null;
}

function route() {
  const h = location.hash.replace(/^#/, '') || 'learn';
  const [name, arg, arg2] = h.split('/');
  lessonCtl.leave();
  playCtl.leave();
  solveCtl.leave();
  if (name === 'lesson' && LESSONS.some(l => l.id === arg)) { show('lesson'); lessonCtl.open(arg, +arg2 || 0); }
  else if (name === 'play') { show('play'); playCtl.enter(); }
  else if (name === 'solve') { show('solve'); solveCtl.enter(); }
  else if (name === 'timer') { show('timer'); timerCtl.render(); }
  else { show('learn'); renderLearn(); }
}

  goPage(i) {
