      cube.setFocus(page.focus ? page.focus(ex) : null);
      cube.setState(page.state(ex));
      if (page.demo) this.runDemo(page, this.token);
      this.renderInfo();
    } else {
      const stage = page.type === 'try' ? { start: page.state(ex), steps: page.steps } : stageOf(ex, page.stage);
      this.steps = stage.steps;
      this.starts = [stage.start];
      for (const st of this.steps) this.starts.push(applyAlg(this.starts[this.starts.length - 1], st.moves));
      this.mode = page.type === 'try' ? 'try' : this.stepsMode;
      this.gotoStep(0);
    }
  },
  async runDemo(page, token) {
    $('#lesson-stage-label').textContent = 'Watch';
    while (token === this.token) {
      cube.setState(page.state(getExample()));
      if (!(await cube.wait(900))) return;
      if (!(await cube.play(page.demo))) return;
      if (!(await cube.wait(1600))) return;
    }
  },
  frame(bodyHTML, footHTML) {
    const L = this.lesson, n = L.pages.length;
    $('#lesson-panel').innerHTML = `
      <div class="panel-head"><button class="back" data-action="go-learn" aria-label="Back to lessons">${ICONS.back}</button><h2>${L.title}</h2></div>
      <div class="dots" role="group" aria-label="Page ${this.pageIdx + 1} of ${n}">${L.pages.map((_, i) => `<button data-action="page-go" data-i="${i}" aria-label="Page ${i + 1}" class="${i === this.pageIdx ? 'on' : i < this.pageIdx ? 'seen' : ''}"></button>`).join('')}</div>
      <div class="panel-body">${bodyHTML}</div>
      <div class="panel-foot">${footHTML}</div>`;
  },
  navFoot() {
    const last = this.pageIdx === this.lesson.pages.length - 1;
    return `<button class="btn ghost" data-action="page-prev" ${this.pageIdx === 0 ? 'disabled' : ''}>Back</button>` +
      (last ? `<button class="btn good" data-action="finish-lesson">Done</button>` : `<button class="btn" data-action="page-next">Next</button>`);
  },
  renderInfo() {
    const p = this.page;
    const algCard = p.alg ? `<div class="alg-card"><h4>${ALG_INFO[p.alg].name}</h4><div class="chips">${chipsHTML(splitAlg(ALG_INFO[p.alg].alg), S0)}</div></div>` : '';
    this.frame(`<div class="eyebrow">${p.eyebrow}</div><h3 class="page-title">${p.title}</h3>${p.body}${algCard}`, this.navFoot());
  },

  // ----- steps pages -----
  gotoStep(i) {
    cube.stop();
    this.playing = false;
    this.partial = null;
    this.stepIdx = Math.max(0, Math.min(i, this.steps.length - 1));
    this.moveIdx = 0;
    cube.setState(this.starts[this.steps.length ? this.stepIdx : 0]);
    this.applyMode();
    this.renderSteps();
  },
  applyMode() {
    const step = this.steps[this.stepIdx];
    cube.setFocus(step?.focus || null);
    const tryMode = this.mode === 'try' && !this.finished;
    cube.inputEnabled = tryMode;
    cube.onUserMove = tryMode ? (tok, fits) => this.userMove(tok, fits) : null;
    $('#lesson-stage-label').textContent = this.finished ? '' : tryMode ? 'Your turn: swipe the cube' : 'Watch';
    this.showNextArrow();
    if (tryMode) this.autoRotate();
  },
  expected() {
    const step = this.steps[this.stepIdx];
    if (!step) return null;
    return this.partial || step.moves[this.moveIdx] || null;
  },
  showNextArrow() {
    if (this.playing || this.finished) return cube.showArrow(null);
    cube.showArrow(this.expected());
  },
  stepTitle(step) {
    const [title, text] = describeStep(step, this.page.stage);
    return { title, text };
  },
  renderSteps() {
    const page = this.page;
    const step = this.steps[this.stepIdx];
    const nSteps = this.steps.length;
    const modeSeg = page.type === 'try' ? '' : `<div class="seg" role="group" aria-label="Mode"><button data-action="mode" data-mode="watch" aria-pressed="${this.mode === 'watch'}">Watch</button><button data-action="mode" data-mode="try" aria-pressed="${this.mode === 'try'}">Try it</button></div>`;
    const exTools = page.type === 'try' ? '' : `<div class="ex-bar">${modeSeg}<span class="btn-row"><button class="btn ghost small" data-action="real-cube">Real cube?</button><button class="btn ghost small" data-action="new-example" aria-label="New example cube">${ICONS.shuffle}</button></span></div>`;
    if (this.finished) {
      const idx = LESSONS.indexOf(this.lesson);
      const next = LESSONS[idx + 1];
      const isTry = page.type === 'try';
      const doneBody = `${exTools}<div class="done-card"><div class="big">${next ? '🎉' : '🏆'}</div><h3>${next ? (isTry ? 'Nice moves!' : 'Stage done!') : 'You solved the cube!'}</h3>${isTry ? page.body : `<p>${next ? 'That’s this stage done on the example cube. Try it on your own cube, then move on.' : 'That’s the whole method. Practise it in Play, and time yourself in Timer.'}</p>`}
        <div class="btn-row" style="justify-content:center;margin-top:14px"><button class="btn ghost small" data-action="step-restart">${ICONS.replay} Again</button>${!isTry ? `<button class="btn ghost small" data-action="mode-try-again">Try it myself</button>` : ''}</div></div>`;
      this.frame(doneBody, next ? `<button class="btn ghost" data-action="go-learn">Lessons</button><button class="btn good" data-action="open-lesson" data-id="${next.id}">Next: ${next.title}</button>` : `<button class="btn ghost" data-action="go-learn">Lessons</button><button class="btn good" data-action="tab" data-tab="play">Go to Play</button>`);
      return;
    }
    if (!step) {
      this.frame(`${exTools}<div class="step-card"><h3>Nothing to do here!</h3><p>This example cube already has this stage done. Lucky! Tap the shuffle button for a new example, or move on.</p></div>`, this.navFoot());
      return;
    }
    const { title, text } = this.stepTitle(step);
    const startState = this.starts[this.stepIdx];
    const algBlock = step.alg ? (() => {
      const info = ALG_INFO[step.alg];
      const reps = step.reps || 1;
      return `<div class="alg-card"><h4>${info.name}${reps > 1 ? `<span class="count">× ${reps}</span>` : ''}</h4><div class="chips">${chipsHTML(splitAlg(info.alg), S0)}</div></div>`;
    })() : '';
    const tryMode = this.mode === 'try';
    const exp = this.expected();
    let stateNow = startState;
    for (let k = 0; k < this.moveIdx; k++) stateNow = applyMove(stateNow, step.moves[k]);
    const nextBlock = tryMode && exp ? `<button class="big-next" data-action="do-next" aria-label="Do the next move: ${moveLabel(exp, stateNow).text}"><div><small>Next move</small><div class="chips">${chipsHTML([exp], stateNow, { now: 0 })}</div></div><span class="big-next-text">${moveLabel(exp, stateNow).text}<b>Tap here to do it</b></span></button>` : '';
    const controls = tryMode
      ? `<details class="pad-wrap" data-pad="lesson" ${app.padOpen.lesson ? 'open' : ''}><summary>Show move buttons</summary><div class="pad">${padHTML(cube.state)}</div></details>`
      : '';
    const watchFoot = `<div class="controls">
          <button class="btn ghost round" data-action="step-prev" aria-label="Previous step" ${this.stepIdx === 0 && this.moveIdx === 0 ? 'disabled' : ''}>${ICONS.prev}</button>
          <button class="btn play pop" data-action="step-play" aria-label="${this.playing ? 'Pause' : 'Play'}">${this.playing ? ICONS.pause : this.moveIdx >= step.moves.length ? ICONS.replay : ICONS.playIcon}</button>
          <button class="btn ghost round" data-action="step-next" aria-label="Next step">${ICONS.next}</button>
          <button class="btn ghost small speed-btn" data-action="speed" aria-label="Speed">${{ 0.6: '0.5×', 1: '1×', 1.8: '2×' }[store.get('speed')] || '1×'}</button>
        </div>`;
    const body = `${exTools}
      <div class="step-card">
        <div class="step-meta"><span class="pill">Step ${this.stepIdx + 1} of ${nSteps}</span>${step.moves.length} move${step.moves.length === 1 ? '' : 's'}</div>
        <h3>${title}</h3><p>${text}</p>
        ${algBlock}
        <div class="chips" id="step-chips">${chipsHTML(step.moves, startState, { done: this.moveIdx, now: tryMode || this.playing || this.moveIdx > 0 ? this.moveIdx : -1 })}</div>
        ${tryMode ? `<div class="try-hint">👆 <span><b>Two ways to turn:</b> tap the pink button at the bottom, or put your finger on the cube and slide it the way the <b>pink arrow</b> points. Do the same turn on your real cube as you go.</span></div>` : ''}
      </div>
      ${controls}`;
    this.frame(body, tryMode ? (nextBlock || this.navFoot()) : watchFoot);
  },
  updateChips() {
    const step = this.steps[this.stepIdx];
    const el = $('#step-chips');
    if (el && step) el.innerHTML = chipsHTML(step.moves, this.starts[this.stepIdx], { done: this.moveIdx, now: this.moveIdx });
  },
  async playStep() {
    if (this.playing) { this.pause(); return; }
    let step = this.steps[this.stepIdx];
    if (this.moveIdx >= step.moves.length) {
      // replay the finished step
      cube.setState(this.starts[this.stepIdx]);
      this.moveIdx = 0;
    }
    this.playing = true;
    this.renderSteps();
    cube.showArrow(null);
    const from = this.moveIdx;
    const token = this.token;
    const ok = await cube.play(step.moves.slice(from), { onProgress: k => { this.moveIdx = from + k; this.updateChips(); } });
    if (token !== this.token) return;
    this.playing = false;
    if (ok && this.stepIdx === this.steps.length - 1) return this.complete();
    if (ok) {
      // move straight on to the next step, paused, so the next ▶ plays it
      this.stepIdx++;
      this.moveIdx = 0;
      cube.setFocus(this.steps[this.stepIdx].focus || null);
    }
    this.showNextArrow();
    this.renderSteps();
  },
  pause() {
    cube.stop();
    this.playing = false;
    this.showNextArrow();
    this.renderSteps();
  },
  async userMove(tok, fits) {
    if (cube.busy || this.finished) return;
    const exp = this.expected();
    if (!exp) return;
    if (tok !== exp && fits) {
      const e0 = parseMove(exp);
      const options = e0.amount === 2 ? [e0.base, e0.base + "'"] : [exp];
      const match = options.find(fits);
      if (match) tok = match;
    }
    const token = this.token;
    const e = parseMove(exp), u = parseMove(tok);
    cube.showArrow(null);
    if (tok === exp) {
      await cube.play([tok], { arrows: false });
      if (token !== this.token) return;
      this.advance();
    } else if (e.amount === 2 && e.base === u.base) {
      await cube.play([tok], { arrows: false });
      if (token !== this.token) return;
      this.partial = tok;
      toast('Halfway there. Once more the same way!');
      this.renderSteps();
      this.showNextArrow();
    } else {
      await cube.play([tok], { arrows: false });
      if (token !== this.token) return;
      toast(`Not quite: that was ${moveLabel(tok).short}. Putting it back. Follow the pink arrow!`, 2800);
      $('.big-next')?.classList.add('shake');
      await cube.wait(250);
      await cube.play([invertMove(tok)], { arrows: false, speed: 1.4 });
      if (token !== this.token) return;
      this.showNextArrow();
    }
  },
  advance() {
    this.partial = null;
    this.moveIdx++;
    const step = this.steps[this.stepIdx];
    if (this.moveIdx >= step.moves.length) {
      if (this.stepIdx === this.steps.length - 1) return this.complete();
      this.stepIdx++;
      this.moveIdx = 0;
      cube.setFocus(this.steps[this.stepIdx].focus || null);
      toast('Step done! Next one…', 1400);
    }
    this.renderSteps();
    this.showNextArrow();
    this.autoRotate();
  },
  async autoRotate() {
    const exp = this.expected();
    if (!exp || !'xyz'.includes(exp[0]) || this.mode !== 'try') return;
    const token = this.token;
    toast('Turn the whole cube, like this', 1600);
    if (!(await cube.wait(900)) || token !== this.token) return;
    await cube.play([exp]);
    if (token !== this.token) return;
    this.advance();
  },
  complete() {
    this.finished = true;
    this.playing = false;
    cube.inputEnabled = false;
    cube.showArrow(null);
    cube.setFocus(null);
    $('#lesson-stage-label').textContent = '';
    const page = this.page;
    if (page.type === 'try' || this.pageIdx === this.lesson.pages.length - 1) {
      const done = { ...store.get('done'), [this.lesson.id]: true };
      store.set('done', done);
    }
    confetti();
    this.renderSteps();
  },
};

// ----- Free play -----
const playCtl = {
  state: null, history: [], pending: [], running: false, scramble: [], timing: null, t0: 0, moves: 0, raf: 0, scrambling: false,
  enter() {
    if (!this.state) this.state = solvedState();
    cube.mount($('#play-stage'));
    cube.setView('top');
    cube.setFocus(null);
    cube.setState(this.state);
    cube.inputEnabled = true;
    cube.onUserMove = tok => this.userMove(tok);
    this.render();
    this.renderTimer();
  },
  leave() {
    if (app.view !== 'play' || !cube) return;
    cube.stop();
    this.state = cube.state.slice();
    this.pending = [];
    this.running = false;
    this.scrambling = false;
    cube.inputEnabled = false;
    cube.onUserMove = null;
    cancelAnimationFrame(this.raf);
  },
  render() {
    const diffId = store.get('difficulty');
    const diffBtns = DIFFICULTIES.map((d, i) => `<button data-action="difficulty" data-id="${d.id}" aria-pressed="${d.id === diffId}"><span class="diff-bars">${DIFFICULTIES.map((_, j) => `<i class="${j <= i ? 'on' : ''}" style="height:${4 + j * 2}px"></i>`).join('')}</span>${d.label}<small>${d.moves} moves</small></button>`).join('');
    const scr = this.scramble.length ? `<div class="scramble-box"><div class="lbl"><span>Scramble (from solved, yellow up, green front)</span></div><div class="chips">${chipsHTML(this.scramble, S0)}</div></div>` : '';
    $('#play-panel').innerHTML = `
      <div class="panel-head"><h2>Free play</h2>
        <button class="btn ghost small" data-action="undo" ${this.history.length ? '' : 'disabled'}>${ICONS.undo} Undo</button>
        <button class="btn ghost small" data-action="reset-cube">Reset</button></div>
      <div class="panel-body">
        <div class="row-title">Scramble <small style="color:var(--ink-soft);font-family:var(--font-body)">${DIFFICULTIES.find(d => d.id === diffId).blurb}</small></div>
        <div class="diff" role="group" aria-label="Difficulty">${diffBtns}</div>
        <div class="btn-row" style="margin-top:12px"><button class="btn pop" style="flex:1" data-action="scramble" ${this.scrambling ? 'disabled' : ''}>${ICONS.shuffle} Scramble it</button></div>
        ${scr}
        <p style="color:var(--ink-soft);font-size:14px;margin-top:12px">Swipe across a sticker to turn its layer, or drag the background to look around. After a scramble, the timer starts on your first turn and stops when the cube is solved.</p>
        <details class="pad-wrap" data-pad="play" ${app.padOpen.play ? 'open' : ''}><summary>Show move buttons</summary><div class="pad" id="play-pad">${padHTML(cube.state)}</div></details>
      </div>`;
  },
  userMove(tok) {
    if (this.scrambling) return;
    this.pending.push(tok);
    this.process();
  },
  async process() {
    if (this.running) return;
    this.running = true;
    while (this.pending.length && app.view === 'play') {
      const tok = this.pending.shift();
      const undo = tok === '__undo__';
      const move = undo ? invertMove(this.history[this.history.length - 1] || 'y') : tok;
      if (undo && !this.history.length) continue;
      await cube.play([move], { arrows: false, speed: 1.6 });
      if (app.view !== 'play') break;
      if (undo) this.history.pop(); else this.history.push(tok);
      this.state = cube.state.slice();
      if (!'xyz'.includes(move[0])) {
        if (this.timing === 'armed') { this.timing = 'running'; this.t0 = performance.now(); this.moves = 0; this.tick(); }
        if (this.timing === 'running') this.moves++;
      }
      if (this.timing === 'running' && isSolved(this.state)) this.solved();
      const pad = $('#play-pad');
      if (pad) pad.innerHTML = padHTML(this.state);
      const u = $('[data-action="undo"]');
      if (u) u.disabled = !this.history.length;
    }
    this.running = false;
  },
  async doScramble() {
    const d = DIFFICULTIES.find(x => x.id === store.get('difficulty'));
    this.scramble = makeScramble(d.moves);
    this.scrambling = true;
    this.pending = [];
    this.timing = null;
    cancelAnimationFrame(this.raf);
    cube.setState(S0);
    this.render();
    this.renderTimer();
    const ok = await cube.play(this.scramble, { arrows: false, speed: d.moves > 10 ? 3.2 : 2 });
    this.scrambling = false;
    if (!ok || app.view !== 'play') return;
    this.state = cube.state.slice();
    this.history = [];
    this.timing = 'armed';
    this.render();
    this.renderTimer();
  },
  solved() {
    const ms = performance.now() - this.t0;
    this.timing = 'done';
    this.lastTime = ms;
    cancelAnimationFrame(this.raf);
    timerCtl.add({ ms, kind: 'virtual', moves: this.moves, diff: store.get('difficulty') });
    this.renderTimer();
    confetti();
    toast(`Solved in ${fmtTime(ms)}! 🎉`, 3000);
  },
  tick() {
    this.renderTimer();
    if (this.timing === 'running') this.raf = requestAnimationFrame(() => this.tick());
  },
  renderTimer() {
    const el = $('#play-timer');
    el.className = 'timer-chip';
    if (this.timing === 'armed') { el.classList.add('show', 'armed'); el.textContent = 'Timer starts on your first turn'; }
    else if (this.timing === 'running') { el.classList.add('show'); el.innerHTML = `${fmtTime(performance.now() - this.t0)}<small>${this.moves} moves</small>`; }
    else if (this.timing === 'done') { el.classList.add('show'); el.innerHTML = `✓ ${fmtTime(this.lastTime)}<small>${this.moves} moves</small>`; }
  },
};

// ----- Timer -----
function fmtTime(ms) {
  if (ms == null || !isFinite(ms)) return '–';
  const cs = Math.floor(ms / 10);
  const m = Math.floor(cs / 6000), s = Math.floor(cs / 100) % 60, c = cs % 100;
  return (m ? `${m}:${String(s).padStart(2, '0')}` : `${s}`) + '.' + String(c).padStart(2, '0');
}
function avgOf(times, n) {
  if (times.length < n) return null;
  const last = times.slice(0, n).map(t => t.ms).sort((a, b) => a - b);
  const trimmed = n >= 5 ? last.slice(1, -1) : last;
  return trimmed.reduce((a, b) => a + b, 0) / trimmed.length;
}
const timerCtl = {
  state: 'idle', t0: 0, raf: 0, scramble: null,
  add(entry) {
    const times = [{ ...entry, at: Date.now() }, ...store.get('times')].slice(0, 200);
    store.set('times', times);
  },
  render() {
    const times = store.get('times');
    const diffId = store.get('timerDifficulty');
    if (!this.scramble) this.scramble = makeScramble(DIFFICULTIES.find(d => d.id === diffId).moves);
    const best = times.length ? Math.min(...times.map(t => t.ms)) : null;
    const diffBtns = DIFFICULTIES.map(d => `<button data-action="timer-difficulty" data-id="${d.id}" aria-pressed="${d.id === diffId}">${d.label}<small>${d.moves} moves</small></button>`).join('');
    $('#view-timer').innerHTML = `<div class="timer-wrap">
      <h2 style="font-size:24px;margin:6px 0 0">Time your real cube</h2>
      <button class="timer-pad ${this.state === 'running' ? 'running' : ''}" data-action="timer-toggle" id="timer-pad">
        <span class="time" id="timer-time">${this.state === 'running' ? fmtTime(performance.now() - this.t0) : fmtTime(this.last ?? 0)}</span>
        <span class="hint">${this.state === 'running' ? 'Tap to stop' : 'Tap to start'}</span>
      </button>
      <p style="color:var(--ink-soft);margin-top:14px">Scramble your cube with these moves first (start solved, yellow up, green front). Tap the big button to start and again when it’s solved, or press Space.</p>
      <div class="diff" role="group" aria-label="Scramble difficulty">${diffBtns}</div>
      <div class="scramble-box"><div class="lbl"><span>Scramble</span><button class="link" data-action="timer-new-scramble">New scramble</button></div><div class="chips">${chipsHTML(this.scramble, S0)}</div></div>
      <div class="stats">
        <div class="stat"><b>${fmtTime(best)}</b><span>Best</span></div>
        <div class="stat"><b>${fmtTime(avgOf(times, 5))}</b><span>Avg of 5</span></div>
        <div class="stat"><b>${fmtTime(avgOf(times, 12))}</b><span>Avg of 12</span></div>
      </div>
      <div class="row-title">Your times <span>${times.length ? `<button class="link" data-action="timer-clear">Clear all</button>` : ''}</span></div>
      ${times.length ? `<ol class="times">${times.slice(0, 50).map((t, i) => `<li><span class="t">${fmtTime(t.ms)}</span><span class="meta">${new Date(t.at).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}${t.moves ? ` · ${t.moves} moves` : ''}</span>${t.kind === 'virtual' ? '<span class="tag">3D cube</span>' : ''}<button class="x" data-action="timer-delete" data-i="${i}" aria-label="Delete this time">✕</button></li>`).join('')}</ol>` : '<div class="empty">No times yet. Your solves will show up here.</div>'}
    </div>`;
  },
  toggle() {
    if (this.state === 'running') {
      this.state = 'idle';
      cancelAnimationFrame(this.raf);
      this.last = performance.now() - this.t0;
      this.add({ ms: this.last, kind: 'real', diff: store.get('timerDifficulty') });
      this.scramble = null;
      this.render();
      toast(`${fmtTime(this.last)} saved`);
    } else {
      this.state = 'running';
      this.t0 = performance.now();
      this.render();
      const loop = () => {
        const el = $('#timer-time');
        if (el) el.textContent = fmtTime(performance.now() - this.t0);
        if (this.state === 'running') this.raf = requestAnimationFrame(loop);
      };
      loop();
    }
  },
};

// ----- Solve my cube: scan or enter colours, check, then coach -----
const FACE_STEPS = [
  { face: 'F', center: 'G', top: 'Y', text: 'Hold the cube with <b>yellow on top</b> and the <b>green</b> center facing {cam}.' },
  { face: 'R', center: 'O', top: 'Y', text: 'Turn the whole cube a quarter turn to the left, so <b>orange</b> faces {cam}. Yellow stays on top.' },
  { face: 'B', center: 'B', top: 'Y', text: 'Another quarter turn to the left: <b>blue</b> faces {cam}, yellow still on top.' },
  { face: 'L', center: 'R', top: 'Y', text: 'One more quarter turn: <b>red</b> faces {cam}, yellow on top.' },
  { face: 'U', center: 'Y', top: 'B', text: 'Turn back so green faces you, then tip the top toward you so <b>yellow</b> faces {cam}. Blue is now on top.' },
  { face: 'D', center: 'W', top: 'G', text: 'Turn back again, then tip the bottom toward you so <b>white</b> faces {cam}. Green is now on top.' },
];
const STAGE_NAMES = { daisy: 'Daisy', cross: 'White cross', corners: 'White corners', middle: 'Middle layer', ycross: 'Yellow cross', yface: 'Yellow face', pll: 'Finish' };
const PALETTE = ['W', 'Y', 'G', 'B', 'R', 'O'];
const faceIndex = f => FACES.indexOf(f);
function blankCube() {
  const s = Array(54).fill('?');
  FACES.forEach((f, fi) => { s[fi * 9 + 4] = HOME_COLORS[f]; });
  return s;
}

const solveCtl = {
  screen: 'home', mode: 'camera', faceIdx: 0, facelets: blankCube(), samples: [], locked: [], captured: false, centerWarn: null,
  paint: null, selected: null, stream: null, timer: 0, live: null, coach: null, ready: false, busy: false,

  enter() {
    cube.mount($('#solve-stage'));
    cube.inputEnabled = false;
    cube.onUserMove = null;
    cube.setFocus(null);
    if (this.screen === 'coach' && !this.coach) this.screen = 'home';
    if (this.screen === 'face' && this.mode === 'camera') { this.screen = 'home'; }
    this.show();
  },
  leave() {
    if (app.view !== 'solve' || !cube) return;
    this.stopCamera();
    cube.stop();
  },
  setEditing() {
    const on = this.screen === 'review' || (this.screen === 'face' && (this.mode === 'manual' || this.captured));
    $('#view-solve').classList.toggle('editing', on);
  },
  show() {
    const label = $('#solve-stage-label');
    label.textContent = '';
    if (this.screen === 'home') { cube.setFocus(null); cube.setView('top'); cube.setState(this.coach ? this.coachState() : S0); this.renderHome(); }
    else if (this.screen === 'face') this.renderFace();
    else if (this.screen === 'review') { cube.setView('top'); cube.setState(this.facelets); this.renderReview(); }
    else if (this.screen === 'coach') this.renderCoach();
  },

  // ----- home -----
  renderHome() {
    this.setEditing();
    const saved = store.get('coach');
    const resume = saved && saved.pos > 0 ? `<div class="resume-card"><div><b>You’re part-way through a solve</b><small>Move ${saved.pos} of ${saved.total || '…'}</small></div><button class="btn small" data-action="coach-resume">Continue</button></div>` : '';
    $('#solve-panel').innerHTML = `
      <div class="panel-head"><h2>Solve my cube</h2></div>
      <div class="panel-body">
        ${resume}
        <p>Show me your scrambled cube and I’ll coach you through solving it, one turn at a time, with the same method as the lessons.</p>
        <div class="choice-list">
          <button class="choice" data-action="scan-start" data-mode="camera"><span class="choice-ic">📷</span><span><b>Scan with the camera</b><small>Show each of the 6 sides to your camera. You can fix any colour it gets wrong.</small></span></button>
          <button class="choice" data-action="scan-start" data-mode="manual"><span class="choice-ic">✋</span><span><b>Enter the colours by hand</b><small>Tap in the colours of each side yourself.</small></span></button>
        </div>
        <ul class="tips" style="margin-top:16px"><li data-i="💡">Scan in bright, even light. Avoid shiny reflections on the stickers.</li><li data-i="🎯">Hold the cube close so one side fills the square.</li></ul>
      </div>`;
  },

  // ----- scanning / entering one side at a time -----
  async start(mode) {
    this.mode = mode;
    this.faceIdx = 0;
    this.facelets = blankCube();
    this.samples = [];
    this.locked = [];
    this.captured = false;
    this.centerWarn = null;
    this.selected = null;
    this.paint = mode === 'manual' ? 'W' : null;
    this.screen = 'face';
    if (mode === 'camera') {
      try {
        await this.startCamera();
      } catch (err) {
        console.warn(err);
        this.mode = 'manual';
        this.paint = 'W';
        toast('Couldn’t open the camera, so you can tap the colours in instead.', 3600);
      }
    }
    this.show();
  },
  async startCamera() {
    if (!navigator.mediaDevices?.getUserMedia) throw new Error('Camera not available');
    this.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    const v = $('#scan-video');
    v.srcObject = this.stream;
    await v.play();
    $('#solve-stage').classList.add('scanning');
    $('#scan-guide').hidden = false;
    this.sizeGuide();
    clearInterval(this.timer);
    this.timer = setInterval(() => this.liveTick(), 160);
  },
  stopCamera() {
    clearInterval(this.timer);
    this.stream?.getTracks().forEach(t => t.stop());
    this.stream = null;
    $('#solve-stage').classList.remove('scanning');
    $('#scan-guide').hidden = true;
  },
  sizeGuide() {
    const st = $('#solve-stage');
    const g = Math.round(Math.min(st.clientWidth, st.clientHeight) * 0.72);
    $('#scan-guide').style.setProperty('--g', g + 'px');
    return g;
  },
  // Average colour of the middle of each of the 9 squares inside the guide
  sample() {
    const v = $('#scan-video');
    if (!v.videoWidth) return null;
    const st = $('#solve-stage');
    const W = st.clientWidth, H = st.clientHeight, g = this.sizeGuide();
    const scale = Math.max(W / v.videoWidth, H / v.videoHeight);
    const offX = (W - v.videoWidth * scale) / 2, offY = (H - v.videoHeight * scale) / 2;
    const sx = ((W - g) / 2 - offX) / scale, sy = ((H - g) / 2 - offY) / scale, sw = g / scale;
    this.canvas ||= document.createElement('canvas');
    this.canvas.width = this.canvas.height = 90;
    const ctx = this.canvas.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(v, sx, sy, sw, sw, 0, 0, 90, 90);
    const d = ctx.getImageData(0, 0, 90, 90).data;
    const out = [];
    for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) {
      let R = 0, G = 0, B = 0, n = 0;
      for (let y = r * 30 + 9; y < r * 30 + 21; y++) for (let x = c * 30 + 9; x < c * 30 + 21; x++) {
        const k = (y * 90 + x) * 4;
        R += d[k]; G += d[k + 1]; B += d[k + 2]; n++;
      }
      out.push([R / n, G / n, B / n]);
    }
    return out;
  },
  liveTick() {
    if (this.screen !== 'face' || this.captured || this.mode !== 'camera') return;
    const rgbs = this.sample();
    if (!rgbs) return;
    this.live = rgbs.map(guessColor);
    const cells = document.querySelectorAll('#scan-guide .scan-grid i');
    cells.forEach((el, k) => el.style.setProperty('--c', COLOR_HEX[this.live[k]]));
    document.querySelectorAll('#face-edit .fcell').forEach((el, k) => { if (k !== 4) el.style.setProperty('--c', COLOR_HEX[this.live[k]]); });
  },
  capture() {
    const rgbs = this.sample();
    if (!rgbs) return toast('The camera isn’t ready yet');
    const step = FACE_STEPS[this.faceIdx];
    const fi = faceIndex(step.face);
    rgbs.forEach((rgb, k) => {
      const i = fi * 9 + k;
      this.samples[i] = rgb;
      this.facelets[i] = k === 4 ? step.center : guessColor(rgb);
      this.locked[i] = false;
    });
    const seen = guessColor(rgbs[4]);
    this.centerWarn = seen !== step.center ? seen : null;
    this.captured = true;
    this.selected = null;
    $('#solve-stage').classList.add('flash');
    setTimeout(() => $('#solve-stage').classList.remove('flash'), 250);
    this.renderFace();
  },
  retake() {
    this.captured = false;
    this.centerWarn = null;
    this.selected = null;
    this.renderFace();
  },
  nextFace() {
    if (this.faceIdx < FACE_STEPS.length - 1) {
      this.faceIdx++;
      this.captured = false;
      this.centerWarn = null;
      this.selected = null;
      this.renderFace();
      return;
    }
    if (this.mode === 'camera') {
      this.facelets = refineColors(this.facelets, this.samples, this.locked);
      this.stopCamera();
    }
    this.selected = null;
    this.paint = null;
    this.screen = 'review';
    this.show();
  },
  prevFace() {
    if (this.faceIdx === 0) { this.stopCamera(); this.screen = 'home'; this.show(); return; }
    this.faceIdx--;
    this.captured = this.mode === 'camera';
    this.selected = null;
    this.renderFace();
  },
  faceGridHTML(fi, editable) {
    const cells = [];
    for (let k = 0; k < 9; k++) {
      const i = fi * 9 + k;
      const c = this.facelets[i];
      const cls = ['fcell', k === 4 ? 'center' : '', this.selected === i ? 'sel' : '', c === '?' ? 'blank' : ''].join(' ');
      cells.push(`<button class="${cls}" ${editable && k !== 4 ? `data-action="cell" data-i="${i}"` : 'tabindex="-1"'} style="--c:${COLOR_HEX[c]}" aria-label="${k === 4 ? 'Center' : 'Sticker'} ${k + 1}: ${COLOR_NAMES[c] || 'blank'}"></button>`);
    }
    return cells.join('');
  },
  paletteHTML(withCounts) {
    const counts = {};
    this.facelets.forEach(c => { counts[c] = (counts[c] || 0) + 1; });
    return `<div class="palette" role="group" aria-label="Colours">${PALETTE.map(c => `<button data-action="paint" data-c="${c}" aria-pressed="${this.paint === c}" aria-label="${COLOR_NAMES[c]}"><i style="background:${COLOR_HEX[c]}"></i>${withCounts ? `<small class="${counts[c] === 9 ? 'ok' : counts[c] > 9 ? 'over' : ''}">${counts[c] || 0}/9</small>` : ''}</button>`).join('')}</div>`;
  },
  renderFace() {
    const step = FACE_STEPS[this.faceIdx];
    const fi = faceIndex(step.face);
    const cam = this.mode === 'camera';
    const n = FACE_STEPS.length;
    $('#solve-stage-label').textContent = cam ? (this.captured ? 'Got it! Check the colours below' : `Fill the square with the ${COLOR_NAMES[step.center]} side`) : `The ${COLOR_NAMES[step.center]} side`;
    if (!cam) {
      cube.setFocus(null);
      cube.setState(this.facelets);
      cube.setView(step.face);
    } else {
      const grid = $('#scan-guide .scan-grid');
      grid.classList.toggle('frozen', this.captured);
      grid.querySelectorAll('i').forEach((el, k) => el.style.setProperty('--c', this.captured ? COLOR_HEX[this.facelets[fi * 9 + k]] : 'transparent'));
    }
    const editable = !cam || this.captured;
    this.setEditing();
    const hint = cam && !this.captured
      ? 'Line the side up with the square. When the dots match your stickers, tap <b>Capture</b>.'
      : cam ? 'Does it match your cube? If a colour is wrong, tap that sticker, then tap the right colour.'
        : 'Pick a colour, then tap the stickers to paint them. The middle is already filled in.';
    const warn = this.centerWarn ? `<div class="warn-box">The middle looked ${COLOR_NAMES[this.centerWarn]}, not ${COLOR_NAMES[step.center]}. Make sure the ${COLOR_NAMES[step.center]} side is facing the camera, or tap Retake.</div>` : '';
    const foot = cam && !this.captured
      ? `<button class="btn ghost" data-action="face-prev">Back</button><button class="btn pop" data-action="capture">📸 Capture</button>`
      : `<button class="btn ghost" data-action="${cam ? 'retake' : 'face-prev'}">${cam ? 'Retake' : 'Back'}</button><button class="btn" data-action="face-next">${this.faceIdx === n - 1 ? 'Check my cube' : 'Next side'}</button>`;
    $('#solve-panel').innerHTML = `
      <div class="panel-head"><button class="back" data-action="solve-home" aria-label="Back">${ICONS.back}</button><h2>${cam ? 'Scan' : 'Enter'} side ${this.faceIdx + 1} of ${n}</h2></div>
      <div class="dots">${FACE_STEPS.map((_, i) => `<i class="dot-static ${i === this.faceIdx ? 'on' : i < this.faceIdx ? 'seen' : ''}"></i>`).join('')}</div>
      <div class="panel-body">
        <div class="face-row">
          <div class="face-mini" aria-hidden="true"><span class="top-tag" style="--c:${COLOR_HEX[step.top]}">${cap(COLOR_NAMES[step.top])} on top</span><span class="mini-sq" style="background:${COLOR_HEX[step.center]}"></span></div>
          <p>${step.text.replace('{cam}', cam ? 'the camera' : 'you')}</p>
        </div>
        ${warn}
        <div class="face-wrap"><div class="face-edit" id="face-edit">${this.faceGridHTML(fi, editable)}</div></div>
        <p class="hint">${hint}</p>
        ${editable ? this.paletteHTML(false) : ''}
      </div>
      <div class="panel-foot">${foot}</div>`;
    if (cam && !this.captured && this.live) this.liveTick();
  },

  // ----- editing -----
  tapCell(i) {
    if (this.paint) { this.setColor(i, this.paint); return; }
    this.selected = this.selected === i ? null : i;
    this.refreshEditor();
  },
  tapPaint(c) {
    if (this.selected != null) { this.setColor(this.selected, c); this.selected = null; this.refreshEditor(); return; }
    this.paint = this.paint === c ? null : c;
    this.refreshEditor();
  },
  setColor(i, c) {
    this.facelets[i] = c;
    this.locked[i] = true;
    if (this.screen === 'review' || this.mode === 'manual') cube.setState(this.facelets);
    this.refreshEditor();
  },
  refreshEditor() {
    if (this.screen === 'face') this.renderFace();
    else if (this.screen === 'review') this.renderReview();
  },

  // ----- review the whole cube -----
  renderReview() {
    const v = validateState(this.facelets);
    const bad = new Set(v.bad);
    const face = f => {
      const fi = faceIndex(f);
      return `<div class="net-face" style="grid-area:${f}">${[...Array(9)].map((_, k) => {
        const i = fi * 9 + k, c = this.facelets[i];
        return `<button class="ncell ${k === 4 ? 'center' : ''} ${bad.has(i) ? 'bad' : ''} ${this.selected === i ? 'sel' : ''} ${c === '?' ? 'blank' : ''}" ${k === 4 ? 'tabindex="-1"' : `data-action="cell" data-i="${i}"`} style="--c:${COLOR_HEX[c]}" aria-label="${COLOR_NAMES[c] || 'blank'}"></button>`;
      }).join('')}</div>`;
    };
    this.setEditing();
    $('#solve-stage-label').textContent = 'Drag to spin and compare with your cube';
    $('#solve-panel').innerHTML = `
      <div class="panel-head"><button class="back" data-action="solve-home" aria-label="Back">${ICONS.back}</button><h2>Check your cube</h2></div>
      <div class="panel-body">
        <p>Compare this with your real cube. To fix a colour, tap the sticker, then tap the right colour.</p>
        <div class="net">${FACES.map(face).join('')}</div>
        ${this.paletteHTML(true)}
        ${v.ok ? `<div class="ok-box">✓ Looks like a real cube. You’re ready to solve it!</div>` : `<div class="warn-box">${v.errors.map(e => `<p>${e}</p>`).join('')}</div>`}
      </div>
      <div class="panel-foot"><button class="btn ghost" data-action="scan-start" data-mode="${this.mode}">Start again</button><button class="btn good" data-action="coach-start" ${v.ok ? '' : 'disabled'}>Start solving</button></div>`;
  },

  // ----- coach -----
  startCoach(start, pos = 0) {
    let stages;
    try { stages = solveLBL(start); } catch (err) { console.error(err); toast('Sorry, I couldn’t work out a solution for that cube. Check the colours again.', 3600); return; }
    const flat = [];
    stages.forEach((st, si) => st.steps.forEach((step, ki) => step.moves.forEach((tok, mi) => flat.push({ si, ki, mi, tok }))));
    this.coach = { start: start.slice(), stages, flat, pos: Math.min(pos, flat.length) };
    this.ready = pos > 0;
    this.saveCoach();
    this.screen = 'coach';
    cube.setView('top');
    cube.setState(this.coachState());
    this.renderCoach();
  },
  saveCoach() {
    const c = this.coach;
    store.set('coach', c && c.pos < c.flat.length ? { start: c.start.join(''), pos: c.pos, total: c.flat.length } : null);
  },
  coachState(pos = this.coach.pos) {
    return applyAlg(this.coach.start, this.coach.flat.slice(0, pos).map(f => f.tok));
  },
  renderCoach() {
    const c = this.coach;
    this.setEditing();
    const label = $('#solve-stage-label');
    cube.inputEnabled = false;
    const strip = stageIdx => `<div class="stage-strip">${c.stages.map((st, i) => `<span class="${i < stageIdx || !st.steps.length ? 'done' : i === stageIdx ? 'now' : ''}">${i < stageIdx || (!st.steps.length && i !== stageIdx) ? '✓ ' : ''}${STAGE_NAMES[st.id]}</span>`).join('')}</div>`;
    const head = `<div class="panel-head"><button class="back" data-action="solve-home" aria-label="Back">${ICONS.back}</button><h2>Solving your cube</h2><button class="btn ghost small" data-action="coach-oops">I messed up</button></div>`;
    if (!c.flat.length) {
      cube.showArrow(null);
      label.textContent = '';
      $('#solve-panel').innerHTML = `${head}<div class="panel-body"><div class="done-card"><div class="big">✨</div><h3>It’s already solved!</h3><p>Scramble it and scan it again when you’re ready.</p></div></div><div class="panel-foot"><button class="btn" data-action="scan-start" data-mode="${this.mode}">Scan again</button></div>`;
      return;
    }
    if (c.pos >= c.flat.length) {
      cube.showArrow(null);
      cube.setFocus(null);
      label.textContent = '';
      $('#solve-panel').innerHTML = `${head}${strip(c.stages.length)}<div class="panel-body"><div class="done-card"><div class="big">🏆</div><h3>You solved your cube!</h3><p>${c.flat.length} turns, all by you. Scramble it and do it again: it gets faster every time.</p></div></div>
        <div class="panel-foot"><button class="btn ghost" data-action="tab" data-tab="timer">Time yourself</button><button class="btn good" data-action="scan-start" data-mode="${this.mode}">Solve another</button></div>`;
      return;
    }
    if (!this.ready) {
      cube.showArrow(null);
      cube.setFocus(null);
      label.textContent = 'Your cube';
      $('#solve-panel').innerHTML = `${head}<div class="panel-body"><div class="eyebrow">Get ready</div><h3 class="page-title">Hold it like this</h3>
        <p>Hold your cube with <b>yellow on top</b> and <b>green facing you</b>, just like the cube on screen.</p>
        <p>I’ll show one turn at a time. Do it on your cube, then tap the pink button. It’s about ${c.flat.length} turns, so take your time.</p></div>
        <div class="panel-foot"><button class="btn pop" data-action="coach-ready">I’m ready</button></div>`;
      return;
    }
    const cur = c.flat[c.pos];
    const stage = c.stages[cur.si];
    const step = stage.steps[cur.ki];
    const [title, text] = describeStep(step, stage.id);
    let stepStart = this.coachState(c.pos - cur.mi);
    const now = this.coachState();
    const lab = moveLabel(cur.tok, now);
    const algBlock = step.alg ? `<div class="alg-card"><h4>${ALG_INFO[step.alg].name}${step.reps > 1 ? `<span class="count">× ${step.reps}</span>` : ''}</h4><div class="chips">${chipsHTML(splitAlg(ALG_INFO[step.alg].alg), S0)}</div></div>` : '';
    cube.setFocus(step.focus || null);
    if (!cube.busy) cube.showArrow(cur.tok);
    label.textContent = `Turn ${c.pos + 1} of ${c.flat.length}`;
    $('#solve-panel').innerHTML = `${head}${strip(cur.si)}
      <div class="panel-body">
        <div class="step-card">
          <div class="step-meta"><span class="pill">${STAGE_NAMES[stage.id]}</span>step ${cur.ki + 1} of ${stage.steps.length}</div>
          <h3>${title}</h3><p>${text}</p>
          ${algBlock}
          <div class="chips">${chipsHTML(step.moves, stepStart, { done: cur.mi, now: cur.mi })}</div>
        </div>
        <p style="margin-top:12px"><button class="link" data-action="open-lesson" data-id="${stage.id}">How does this stage work?</button></p>
      </div>
      <div class="panel-foot coach-foot">
        <div class="mini-col"><button class="btn ghost round" data-action="coach-back" aria-label="Back one turn" ${c.pos === 0 ? 'disabled' : ''}>${ICONS.undo}</button><small>Back</small></div>
        <div class="mini-col"><button class="btn ghost round" data-action="coach-show" aria-label="Show me again">${ICONS.replay}</button><small>Again</small></div>
        <button class="big-next" data-action="coach-done" aria-label="Done: ${lab.text}"><div><small>Do this on your cube</small><div class="chips">${chipsHTML([cur.tok], now, { now: 0 })}</div></div><span class="big-next-text">${lab.text}<b>Tap when done ✓</b></span></button></div>`;
  },
  async coachDone() {
    const c = this.coach;
    if (this.busy || !c || c.pos >= c.flat.length) return;
    this.busy = true;
    const cur = c.flat[c.pos];
    await cube.play([cur.tok], { arrows: false });
    this.busy = false;
    if (app.view !== 'solve' || this.coach !== c) return;
    c.pos++;
    this.saveCoach();
    const next = c.flat[c.pos];
    if (!next) { confetti(); }
    else if (next.si !== cur.si) { confetti(); toast(`${STAGE_NAMES[c.stages[cur.si].id]} done! Next: ${STAGE_NAMES[c.stages[next.si].id]}`, 2600); }
    this.renderCoach();
  },
  async coachBack() {
    const c = this.coach;
    if (this.busy || !c || c.pos === 0) return;
    this.busy = true;
    const tok = invertMove(c.flat[c.pos - 1].tok);
    cube.showArrow(null);
    toast(`Undo it on your cube too: ${moveLabel(tok, this.coachState()).short}`, 2800);
    await cube.play([tok]);
    this.busy = false;
    if (app.view !== 'solve' || this.coach !== c) return;
    c.pos--;
    this.saveCoach();
    this.renderCoach();
  },
  async coachShow() {
    const c = this.coach;
    if (this.busy || !c) return;
    this.busy = true;
    const tok = c.flat[c.pos].tok;
    await cube.play([tok]);
    await cube.wait(500);
    await cube.play([invertMove(tok)], { arrows: false, speed: 1.6 });
    this.busy = false;
    if (app.view === 'solve' && this.coach === c) this.renderCoach();
  },
};
function oopsSheet() {
  openSheet(`<h2>No problem!</h2>
    <div class="choice-list">
      <button class="choice" data-action="close-sheet"><span class="choice-ic">↶</span><span><b>I did one or two wrong turns</b><small>Close this, then use “Back one turn”. Do the same undo turns on your cube.</small></span></button>
      <button class="choice" data-action="scan-start" data-mode="camera"><span class="choice-ic">📷</span><span><b>Rescan my cube</b><small>Scan it again and I’ll carry on from where your cube is now.</small></span></button>
      <button class="choice" data-action="scan-start" data-mode="manual"><span class="choice-ic">✋</span><span><b>Enter the colours by hand</b><small>Tap in where every colour is now.</small></span></button>
    </div>`);
}

// ---------- Sheets ----------
function settingsSheet() {
  const theme = store.get('theme'), speed = store.get('speed');
  openSheet(`<h2>Settings</h2>
    <div class="setting"><div><b>Show move letters</b><small>Standard notation like R U R′ U′, next to the words.</small></div>
      <button class="switch" role="switch" aria-checked="${store.get('notation')}" data-action="toggle-notation" aria-label="Show move letters"></button></div>
    <div class="setting"><div><b>Animation speed</b></div>
      <div class="seg">${[[0.6, 'Slow'], [1, 'Normal'], [1.8, 'Fast']].map(([v, l]) => `<button data-action="set-speed" data-v="${v}" aria-pressed="${speed === v}">${l}</button>`).join('')}</div></div>
    <div class="setting"><div><b>Theme</b></div>
      <div class="seg">${[['auto', 'Auto'], ['light', 'Light'], ['dark', 'Dark']].map(([v, l]) => `<button data-action="set-theme" data-v="${v}" aria-pressed="${theme === v}">${l}</button>`).join('')}</div></div>
    <div class="setting"><div><b>Reset lesson progress</b><small>Clears the ticks on your lessons. Times are kept.</small></div>
      <button class="btn ghost small" data-action="reset-progress">Reset</button></div>
    <p style="color:var(--ink-soft);font-size:13px;margin-top:10px">Everything is saved in this browser only.</p>`);
}
function realCubeSheet() {
  const ex = getExample();
  openSheet(`<h2>Follow along on your real cube</h2>
    <p>To get the same cube as the example, start with a <b>solved</b> cube, yellow on top and green facing you, and do these moves:</p>
    <div class="scramble-box"><div class="chips">${chipsHTML(ex.scramble, S0)}</div></div>
    <p style="margin-top:12px">Each lesson picks up where the one before finished, so go through them in order and your real cube will match the screen.</p>
    <p style="color:var(--ink-soft);font-size:14px">Cube already scrambled? Use the <b>Solve</b> tab instead: scan your cube and get coached through solving it.</p>
    <div class="btn-row" style="margin-top:10px"><button class="btn" style="flex:1" data-action="close-sheet">Got it</button></div>`);
}

// ---------- Events ----------
const actions = {
  tab: el => { location.hash = el.dataset.tab; },
  'go-learn': () => { location.hash = 'learn'; },
  'open-lesson': el => {
    const resume = store.get('resume');
    const page = resume && resume.id === el.dataset.id && !store.get('done')[el.dataset.id] ? resume.page : 0;
    if (location.hash === `#lesson/${el.dataset.id}/${page}`) route();
    else location.hash = `lesson/${el.dataset.id}/${page}`;
  },
  'page-next': () => lessonCtl.goPage(lessonCtl.pageIdx + 1),
  'page-go': el => lessonCtl.goPage(+el.dataset.i),
  'page-prev': () => lessonCtl.goPage(lessonCtl.pageIdx - 1),
  'finish-lesson': () => {
    store.set('done', { ...store.get('done'), [lessonCtl.lesson.id]: true });
    const next = LESSONS[LESSONS.indexOf(lessonCtl.lesson) + 1];
    confetti();
    location.hash = next ? `lesson/${next.id}/0` : 'learn';
  },
  mode: el => { lessonCtl.mode = lessonCtl.stepsMode = el.dataset.mode; lessonCtl.gotoStep(lessonCtl.stepIdx); },
  'mode-try-again': () => { lessonCtl.mode = lessonCtl.stepsMode = 'try'; lessonCtl.finished = false; lessonCtl.gotoStep(0); },
  'step-play': () => lessonCtl.playStep(),
  'do-next': () => { const exp = lessonCtl.expected(); if (exp) lessonCtl.userMove(exp); },
  'step-next': () => {
    const L = lessonCtl;
    if (L.stepIdx === L.steps.length - 1) { cube.setState(L.starts[L.steps.length]); L.complete(); }
    else L.gotoStep(L.stepIdx + 1);
  },
  'step-prev': () => { const L = lessonCtl; L.gotoStep(L.moveIdx > 0 && !L.playing ? L.stepIdx : L.stepIdx - 1); },
  'step-restart': () => { lessonCtl.finished = false; lessonCtl.gotoStep(0); },
  speed: () => {
    const order = [0.6, 1, 1.8];
    const v = order[(order.indexOf(store.get('speed')) + 1) % 3];
    store.set('speed', v);
    cube.speed = v;
    $('.speed-btn').textContent = { 0.6: '0.5×', 1: '1×', 1.8: '2×' }[v];
  },
  'new-example': () => {
    newExample();
    toast('New example cube!');
    lessonCtl.goPage(lessonCtl.pageIdx);
  },
  'real-cube': realCubeSheet,
  pad: el => cube.onUserMove?.(el.dataset.move),
  'reset-view': () => cube.setView(cube.view),
  settings: settingsSheet,
  'close-sheet': closeSheet,
  'toggle-notation': el => {
    store.set('notation', !store.get('notation'));
    el.setAttribute('aria-checked', store.get('notation'));
    if (app.view === 'lesson' && lessonCtl.lesson) { lessonCtl.page.type === 'info' ? lessonCtl.renderInfo() : lessonCtl.renderSteps(); }
    if (app.view === 'play') playCtl.render();
    if (app.view === 'timer') timerCtl.render();
  },
  'set-speed': el => { store.set('speed', +el.dataset.v); cube.speed = +el.dataset.v; settingsSheet(); },
  'set-theme': el => { setTheme(el.dataset.v); settingsSheet(); },
  'reset-progress': () => {
    if (!confirm('Clear the ticks on all lessons?')) return;
    store.set('done', {}); store.set('resume', null);
    closeSheet();
    if (app.view === 'learn') renderLearn();
    toast('Progress reset');
  },
  difficulty: el => { store.set('difficulty', el.dataset.id); playCtl.render(); },
  scramble: () => playCtl.doScramble(),
  undo: () => { if (!playCtl.scrambling) { playCtl.pending.push('__undo__'); playCtl.process(); } },
  'reset-cube': () => {
    playCtl.pending = []; playCtl.history = []; playCtl.scramble = []; playCtl.timing = null; playCtl.scrambling = false;
    cancelAnimationFrame(playCtl.raf);
    playCtl.state = solvedState();
    cube.setState(playCtl.state);
    playCtl.render(); playCtl.renderTimer();
  },
  'scan-start': el => { closeSheet(); if (app.view !== 'solve') location.hash = 'solve'; solveCtl.stopCamera(); solveCtl.start(el.dataset.mode); },
  'solve-home': () => { solveCtl.stopCamera(); cube.stop(); solveCtl.screen = 'home'; solveCtl.show(); },
  capture: () => solveCtl.capture(),
  retake: () => solveCtl.retake(),
  'face-next': () => solveCtl.nextFace(),
  'face-prev': () => solveCtl.prevFace(),
  cell: el => solveCtl.tapCell(+el.dataset.i),
  paint: el => solveCtl.tapPaint(el.dataset.c),
  'coach-start': () => solveCtl.startCoach(solveCtl.facelets),
  'coach-resume': () => { const c = store.get('coach'); if (c) solveCtl.startCoach(c.start.split(''), c.pos); },
  'coach-ready': () => { solveCtl.ready = true; solveCtl.renderCoach(); },
  'coach-done': () => solveCtl.coachDone(),
  'coach-back': () => solveCtl.coachBack(),
  'coach-show': () => solveCtl.coachShow(),
  'coach-oops': oopsSheet,
  'timer-toggle': () => timerCtl.toggle(),
  'timer-difficulty': el => { store.set('timerDifficulty', el.dataset.id); timerCtl.scramble = null; timerCtl.render(); },
  'timer-new-scramble': () => { timerCtl.scramble = null; timerCtl.render(); },
  'timer-delete': el => { const t = store.get('times').slice(); t.splice(+el.dataset.i, 1); store.set('times', t); timerCtl.render(); },
  'timer-clear': () => { if (confirm('Delete all your times?')) { store.set('times', []); timerCtl.render(); } },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const fn = actions[el.dataset.action];
  if (fn) { e.preventDefault(); fn(el); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSheet();
  if (app.view === 'timer' && e.code === 'Space' && !e.repeat) { e.preventDefault(); timerCtl.toggle(); }
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => setTheme(store.get('theme')));
document.addEventListener('toggle', e => { const d = e.target; if (d.dataset?.pad) app.padOpen[d.dataset.pad] = d.open; }, true);
window.addEventListener('hashchange', route);

// ---------- Boot ----------
setTheme(store.get('theme'));
renderTabs('learn');
try {
  cube = new Cube3D();
  cube.speed = store.get('speed');
} catch (err) {
  console.error(err);
  document.querySelectorAll('.stage').forEach(s => { s.insertAdjacentHTML('beforeend', '<div class="loading">Your browser couldn’t start the 3D view (WebGL is off or unsupported).</div>'); });
  cube = { mount() {}, stop() {}, setState(s) { this.state = s.slice(); }, setFocus() {}, setView() {}, showArrow() {}, recolor() {}, wait: ms => new Promise(r => setTimeout(() => r(true), ms)), play: async () => true, state: solvedState(), busy: false };
}
route();
</script>
</body>
</html>
